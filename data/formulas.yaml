  # =====================================================================
  # CHECK — контрольные проверки (блокируют выпуск отчёта при ошибке)
  # =====================================================================

  - id: F.CHECK.ALL
    module: CHECK
    name: "Свод проверок"
    unit: bool
    dims: []
    expr: |
      PAYMENT_MIX_SUM   : |mortgage + full + installment − 1| < 1e-9
      SCHEDULE_SUM      : для каждой статьи |Σ_t w − 1| < 1e-9
      SOLD_LE_STOCK     : Σ_t sold[k,t] <= stock[k]
      UNSOLD_AT_END     : остаток > 0 в последнем месяце → предупреждение
      REVENUE_EQ_CF     : Σ план продаж = Σ поступления (эскроу + ДКП) + дебиторка на конец
      BUDGET_EQ_CF      : Σ бюджет по статьям = Σ затрат в CF
      ESCROW_NONNEG     : esc_bal >= 0
      DEBT_LE_LIMIT     : Σ draw <= limit
      DEBT_REPAID       : debt[T] + accrued[T] = 0
      CASH_NONNEG       : cash[t] >= 0 (иначе cash gap)
      SOURCES_PRESENT   : у каждого параметра и формулы есть source_ids, у level 5 — автор и диапазон
      PARKING_NORM      : parking >= MAX(parking_required, TEP.PARKING_GPZU_COUNT) или override с вложенным документом
      NCS_DEVIATION     : |deviation| <= tolerance или есть обоснование
      APT_AREA_MATCH    : |apt_check| <= TEP.APT_AREA_TOLERANCE (иначе предупреждение с разницей в м² и %)
      STAGE_INPUTS      : для стадии GEN.PROJECT_STAGE заполнены обязательные входы раздела TEP с документом
      GPZU_LIMITS       : F.CHECK.GPZU_LIMITS — превышение пределов ГПЗУ без решения об отклонении блокирует отчёт
      APART_ALLOWED     : F.TEP.APART_AREA > 0 → «4.7» ∈ LAND.VRI_CODES (иначе продукт «апартаменты» недоступен)
      GFA_SHARES_SUM    : стадия «оценка участка»: TEP.RES_GFA_SHARE + TEP.APART_GFA_SHARE <= 1
      STORAGE_FIT       : storage_area + F.TEP.PARKING_COUNT × F.TEP.PARKING_SPACE_MIN_AREA <= F.TEP.GFA_BELOW
      BENCH_MIN_COMPS   : выборки аналогов и пар — не меньше BENCH.MARKET_MIN_COMPS или есть экспертное обоснование
      APT_MIX_SHARE_SUM : стадия «оценка участка»: |Σ_k area_share[k] − 1| < 1e-9
      PARKING_AREA_MIN  : TEP.PARKING_AREA_PER_SPACE >= F.TEP.PARKING_SPACE_MIN_AREA
    depends_on: [F.CHECK.GPZU_LIMITS]
    rationale: "Ни одна из этих ошибок исходника не должна повториться незаметно"
    rejected: []
    source_ids: [S_EXPERT]
    legacy: {cells: null, verdict: new}
    status: verified

  - id: F.CHECK.GPZU_LIMITS
    module: CHECK
    name: "Проверка проекта по предельным параметрам ГПЗУ"
    unit: bool
    dims: []
    expr: |
      предел[x] = GPZU.DEVIATION_PERMIT.permitted_value по x, если есть решение об отклонении; иначе значение из ГПЗУ
      F.TEP.GFA_ABOVE (наземная)                <= предел[GPZU.MAX_GFA_ABOVE]
      TEP.MAX_FLOORS (если нет — TEP.AVG_FLOORS) <= предел[GPZU.MAX_FLOORS]
      TEP.BUILDING_HEIGHT_M                     <= предел[GPZU.MAX_HEIGHT_M]
      TEP.FOOTPRINT_AREA / LAND.AREA            <= предел[GPZU.MAX_BUILT_SHARE]
      превышение любого → БЛОКИРУЮЩАЯ ошибка, отчёт не выпускается
      F.TEP.GFA_ABOVE < BENCH.GPZU_UNDERUSE_SHARE × GPZU.MAX_GFA_ABOVE → информационное сообщение «резерв площади по ГПЗУ»
      пустой предел в ГПЗУ — сравнение по нему не выполняется
    depends_on: [F.TEP.GFA_ABOVE, TEP.MAX_FLOORS, TEP.AVG_FLOORS, TEP.BUILDING_HEIGHT_M, TEP.FOOTPRINT_AREA, LAND.AREA, GPZU.MAX_GFA_ABOVE, GPZU.MAX_FLOORS, GPZU.MAX_HEIGHT_M, GPZU.MAX_BUILT_SHARE, GPZU.DEVIATION_PERMIT, BENCH.GPZU_UNDERUSE_SHARE]
    rationale: "Предельные параметры ГПЗУ (ст.38 ГрК РФ) обязательны: проект сверх них не получит разрешение на строительство, а финмодель на его основе завышает выручку. Сравнивается только сопоставимое: наземная ГНС с наземным пределом, этажность, высота, доля застройки. Снять ошибку можно только решением о разрешении на отклонение от предельных параметров (ст.40 ГрК РФ): однократное отклонение не более 10% — упрощённая процедура без публичных слушаний (ч.1.1); отклонение по этажности и высоте в границах исторических поселений не допускается (ч.2). На стадии «Оценка участка» ГНС берётся из ГПЗУ, поэтому проверка выполняется автоматически. Недоиспользование пределов — не ошибка, но резерв площади показывается"
    rejected:
      - "Предупреждение вместо блокирующей ошибки — модель с превышением ГПЗУ ушла бы в банк"
      - "Сравнивать общую ГНС (с подземной частью) с пределом наземной — несопоставимые величины"
      - "Автоматически обрезать ГНС до предела — скрывает расхождение ТЭП и ГПЗУ"
    source_ids: [S_GRK_38, S_GRK_40, S_PROJECT_DOCS]
    legacy: {cells: null, verdict: new}
    status: verified

  # =====================================================================
  # BENCH — статистика бенчмарков (Справочник → Бенчмарки)
  # Аналоги рынка → стартовая цена и темп продаж; расценки компании → ставки статей бюджета.
  # Выборка сохраняется в проекте (BENCH.MARKET_SAMPLE, BENCH.COST_SAMPLE) и замораживается в его версии.
  # Квартили и медиана — линейная интерполяция (как PERCENTILE.INC / QUARTILE.INC в Excel);
  # стандартное отклонение — выборочное (как STDEV.S), чтобы расчёт повторялся в выгрузке Excel.
  # =====================================================================

  - id: F.BENCH.WINDOW_FILTER
    module: BENCH
    name: "Отбор аналогов: сопоставимость, даты, фазы продаж"
    unit: bool
    dims: [i]
    expr: |
      сопоставимость (жёсткие фильтры): product = продукт проекта; struct_system = TEP.STRUCTURAL_SYSTEM;
        F.BENCH.HEIGHT_BAND аналога = F.BENCH.HEIGHT_BAND проекта; excluded = false (исключение — только вручную с причиной)
      break  = MAX(BENCH.STRUCTURAL_BREAK_DATES.date)
      oldest = EDATE(GEN.VALUATION_DATE, −BENCH.PRICE_MAX_AGE_M)
      цены:   from = MAX( EDATE(GEN.VALUATION_DATE, −BENCH.PRICE_WINDOW_M), oldest, break );
              если аналогов со сделками в окне < BENCH.MARKET_MEDIAN_MIN_COMPS:
                from = MAX( EDATE(GEN.VALUATION_DATE, −BENCH.PRICE_WINDOW_EXT_M), oldest, break )
              сделка входит, если from <= дата <= GEN.VALUATION_DATE
      стартовая цена: дополнительно дата сделки < EDATE(first_ddu_date аналога, BENCH.START_PHASE_M)
      фазы продаж аналога (для темпа):
        старт    — первые BENCH.PACE_START_M месяцев с first_ddu_date
        активная — после старта до MIN( даты распроданности BENCH.PACE_ACTIVE_END_SHARE × total_saleable_m2, rnv_date )
        хвост    — после активной фазы, пока продажи видны в ЕИСЖС (до rnv_date)
        аналог не используется для темпа, если активная фаза короче BENCH.PACE_MIN_ACTIVE_M месяцев (для цены — используется)
      темп:   месяцы фазы в окне from = MAX( EDATE(GEN.VALUATION_DATE, −BENCH.PACE_WINDOW_M), break )
    depends_on: [BENCH.MARKET_SAMPLE, TEP.STRUCTURAL_SYSTEM, F.BENCH.HEIGHT_BAND, GEN.VALUATION_DATE, BENCH.STRUCTURAL_BREAK_DATES, BENCH.PRICE_MAX_AGE_M, BENCH.PRICE_WINDOW_M, BENCH.PRICE_WINDOW_EXT_M, BENCH.MARKET_MEDIAN_MIN_COMPS, BENCH.START_PHASE_M, BENCH.PACE_WINDOW_M, BENCH.PACE_START_M, BENCH.PACE_ACTIVE_END_SHARE, BENCH.PACE_MIN_ACTIVE_M]
    rationale: "В расчёт попадает только сопоставимый рынок: тот же продукт, несущая система и группа высотности; свежие сделки после последнего структурного сдвига (01.07.2024). Если свежих аналогов мало, окно расширяется, но не дальше предельной давности. Темп считается по фазам: на старте спрос отложенный, в активной фазе — основной, хвост — неликвидные лоты со скидками; после РНВ продажи идут по ДКП и в ЕИСЖС не видны"
    rejected:
      - "Все доступные сделки без окна — смешивает рынки с разной ипотекой и ценами"
      - "Сделки до 01.07.2024 с индексацией — индекс не компенсирует смену условий ипотеки"
      - "Стартовая цена по текущим ценам аналогов на поздней стадии — завышает старт"
      - "Один темп на весь срок продаж — смешивает старт, основную фазу и хвост"
      - "Конец активной фазы на 90% распроданности — в выборку попадает часть хвоста"
    source_ids: [S_EISZHS_SALES, S_ERZ_LGOTNAYA_2024, S_EXPERT]
    legacy: {cells: null, verdict: new}
    status: needs_verification

  - id: F.BENCH.COMP_PRICE
    module: BENCH
    name: "Цена аналога (средневзвешенная по проданной площади)"
    unit: руб/м2
    dims: [i]
    expr: "comp_price[i] = Σ стоимость сделок[i] / Σ площадь сделок[i]  — по сделкам, прошедшим F.BENCH.WINDOW_FILTER"
    depends_on: [F.BENCH.WINDOW_FILTER, BENCH.MARKET_SAMPLE]
    rationale: "Так считается средняя цена ДДУ в ЕИСЖС: крупные лоты весят больше, цена отражает реально проданные метры"
    rejected: ["Простое среднее цен лотов — дорогие маленькие лоты завышают цену м²"]
    source_ids: [S_EISZHS_SALES]
    legacy: {cells: null, verdict: new}
    status: verified
    example: {input: {deal_values: [10000000, 15000000], deal_areas: [40, 50]}, output: 277777.78}

  - id: F.BENCH.PRICE_INDEXED
    module: BENCH
    name: "Цена аналога на дату оценки"
    unit: руб/м2
    dims: [i]
    expr: "price_idx[i] = comp_price[i] × BENCH.DDU_PRICE_INDEX[GEN.VALUATION_DATE] / BENCH.DDU_PRICE_INDEX[средняя дата сделок аналога, взвешенная по площади]"
    depends_on: [F.BENCH.COMP_PRICE, BENCH.DDU_PRICE_INDEX, GEN.VALUATION_DATE]
    rationale: "Сделки в окне идут в разные месяцы; приведение к одной дате по индексу цен ДДУ региона делает аналоги сравнимыми"
    rejected: ["Без индексации — в расширенном окне 12 месяцев разница цен может быть существенной"]
    source_ids: [S_EISZHS_SERIES]
    legacy: {cells: null, verdict: new}
    status: verified

  - id: F.BENCH.PRICE_ADJUSTED
    module: BENCH
    name: "Цена аналога после корректировок на отличия от проекта"
    unit: руб/м2
    dims: [i]
    expr: "price_adj[i] = price_idx[i] × (1 + Σ_j adj[i,j]);  adj_total[i] = Σ_j |adj[i,j]|;  j — строки BENCH.PRICE_ADJUSTMENTS (локация, класс, отделка, стадия готовности), у каждой — величина, обоснование, источник"
    depends_on: [F.BENCH.PRICE_INDEXED, BENCH.PRICE_ADJUSTMENTS]
    rationale: "Сравнительный подход: цена аналога поправляется на отличия от оцениваемого проекта. Каждая поправка видна и обоснована; сумма модулей поправок показывает, насколько аналог непохож на проект"
    rejected:
      - "Одна общая поправка без разбивки по факторам — непроверяемо"
      - "Суммарная корректировка как алгебраическая сумма — разнонаправленные поправки взаимно гасятся и скрывают непохожесть аналога"
    source_ids: [S_EISZHS_SALES, S_EXPERT]
    legacy: {cells: null, verdict: new}
    status: verified

  - id: F.BENCH.MARKET_PRICE
    module: BENCH
    name: "Рыночная цена по выборке аналогов"
    unit: руб/м2
    dims: []
    expr: |
      n = число аналогов после F.BENCH.WINDOW_FILTER
      n >= BENCH.MARKET_MEDIAN_MIN_COMPS:                     market_price = MEDIAN(price_adj)
      BENCH.MARKET_MIN_COMPS <= n < BENCH.MARKET_MEDIAN_MIN_COMPS: market_price = Σ_i w[i] × price_adj[i],
                                                                w[i] = (1 / (1 + adj_total[i])) / Σ_i (1 / (1 + adj_total[i]))
      n < BENCH.MARKET_MIN_COMPS:                              ошибка — сохранить только с экспертным обоснованием
    depends_on: [F.BENCH.PRICE_ADJUSTED, F.BENCH.WINDOW_FILTER, BENCH.MARKET_MIN_COMPS, BENCH.MARKET_MEDIAN_MIN_COMPS]
    rationale: "Медиана устойчива к выбросам (премиальный или демпингующий ЖК). На малой выборке медиана неустойчива, поэтому больший вес получает самый похожий аналог (с наименьшей суммарной корректировкой) — логика сравнительного подхода в оценке. Результат подставляется в SALES.PRODUCTS.start_price как значение уровня 3"
    rejected: ["Простое среднее по аналогам — один выброс сдвигает цену проекта"]
    source_ids: [S_EISZHS_SALES, S_EXPERT]
    legacy: {cells: null, verdict: new}
    status: verified
    example: {input: {prices: [300000, 320000, 280000], adj_total: [0.10, 0.0, 0.20]}, output: 301215.47, note: "n = 3 — средневзвешенная, веса 0,331 / 0,365 / 0,304"}

  - id: F.BENCH.COMP_PACE
    module: BENCH
    name: "Нормированный темп продаж аналога по фазам"
    unit: доля
    dims: [i, phase]
    expr: "pace_norm[i,m] = проданная площадь[i,m] / площадь в экспозиции на начало месяца[i,m];  comp_pace[i,phase] = СРЕДНЕЕ_m(pace_norm[i,m]) по месяцам фазы (старт, активная, хвост), прошедшим F.BENCH.WINDOW_FILTER"
    depends_on: [F.BENCH.WINDOW_FILTER, BENCH.MARKET_SAMPLE, BENCH.PACE_WINDOW_M]
    rationale: "Темп в доле от предложения сравним между ЖК разного масштаба; по фазам — потому что старт, основная фаза и хвост продаются с разной скоростью; среднее по месяцам сглаживает сезонность"
    rejected:
      - "Абсолютный темп м²/мес — у крупного ЖК он выше просто из-за объёма предложения"
      - "Один темп на весь срок — хвост со скидками занижает темп основной фазы"
    source_ids: [S_EISZHS_SALES]
    legacy: {cells: null, verdict: new}
    status: verified

  - id: F.BENCH.MARKET_PACE
    module: BENCH
    name: "Рыночный темп продаж по фазам"
    unit: доля
    dims: [phase]
    expr: "market_pace[phase] = MEDIAN_i(comp_pace[i,phase]) отдельно для фаз старт, активная, хвост;  ошибка по фазе, если аналогов с данными по ней < BENCH.MARKET_MIN_COMPS (сохранить только с экспертным обоснованием)"
    depends_on: [F.BENCH.COMP_PACE, BENCH.MARKET_MIN_COMPS]
    rationale: "Медиана нормированных темпов устойчива к ЖК со случайно высокими или низкими продажами. SALES.PACE проекта может ссылаться на все три фазы (способ «доля от остатка в месяц»), значение — уровень 3"
    rejected:
      - "Сравнение абсолютных м²/мес между ЖК разного масштаба"
      - "Среднее — чувствительно к одному аномальному ЖК"
    source_ids: [S_EISZHS_SALES]
    legacy: {cells: null, verdict: new}
    status: verified

  - id: F.BENCH.COST_UNIT
    module: BENCH
    name: "Расценка проекта-аналога на дату договора"
    unit: руб/м2
    dims: [i]
    expr: "cost_unit[i] = contract_amount[i] (без НДС) / base_qty[i];  база — по базе статьи: м² ГНС; для паркинга — м² подземной части; для сетей — по типу статьи (capex_items.yaml → base)"
    depends_on: [BENCH.COST_SAMPLE]
    rationale: "Ставка на единицу базы статьи — то, что подставляется в бюджет проекта (ставка × база × индекс). Без НДС — как все затраты в модели (docs/00, соглашения)"
    rejected: ["Сумма договора без деления на базу — не переносится на проект другого размера"]
    source_ids: [S_COMPANY_ACTUALS]
    legacy: {cells: null, verdict: new}
    status: verified

  - id: F.BENCH.COST_INDEXED
    module: BENCH
    name: "Расценка аналога на дату оценки и в регионе проекта"
    unit: руб/м2
    dims: [i]
    expr: "cost_idx[i] = cost_unit[i] × (1 + adj_value[i]) × BENCH.COST_INDEX_HIST[GEN.VALUATION_DATE] / BENCH.COST_INDEX_HIST[contract_date[i]] × ncs_k_per(GEN.REGION_CODE) / ncs_k_per(region_code[i]);  ncs_k_per — из regions.yaml (таблица 1 НЦС); adj_value — корректировка на отличие фасада и т.п. (BENCH.COST_SAMPLE), только с обоснованием"
    depends_on: [BENCH.COST_SAMPLE, F.BENCH.COST_UNIT, BENCH.COST_INDEX_HIST, GEN.VALUATION_DATE, GEN.REGION_CODE]
    rationale: "Время приводится официальными индексами изменения сметной стоимости Минстроя, регион — отношением коэффициентов перехода НЦС (регион проекта / регион аналога). Оба показателя — государственные и одинаковы для всех проектов"
    rejected:
      - "Индекс потребительских цен — не отражает стоимость строительства"
      - "Без регионального пересчёта — московская расценка переносится в регион без поправки"
    source_ids: [S_FGISCS, S_NCS_2026_01]
    legacy: {cells: null, verdict: new}
    status: verified

  - id: F.BENCH.COST_BENCH
    module: BENCH
    name: "Бенчмарк расценки статьи бюджета"
    unit: руб/м2
    dims: [item]
    expr: |
      сопоставимые проекты: housing_class = GEN.HOUSING_CLASS;  |floors / TEP.AVG_FLOORS − 1| <= BENCH.COST_FLOORS_TOLERANCE;
                            structural_system = TEP.STRUCTURAL_SYSTEM;  F.BENCH.HEIGHT_BAND аналога = группа проекта;  VALUATION_DATE − contract_date <= BENCH.COST_MAX_AGE_Y лет;  excluded = false
      n >= BENCH.COST_MIN_PROJECTS: cost_bench = MEDIAN(cost_idx) по сопоставимым проектам (уровень 4)
      n <  BENCH.COST_MIN_PROJECTS: предлагается значение по НЦС (F.CAPEX.NCS_BENCH) с пометкой, параметр — экспертный (уровень 5)
      незавершённые проекты (completed = false) — только по сумме договора, с пометкой
    depends_on: [F.BENCH.COST_INDEXED, BENCH.COST_SAMPLE, GEN.HOUSING_CLASS, TEP.AVG_FLOORS, TEP.STRUCTURAL_SYSTEM, F.BENCH.HEIGHT_BAND, BENCH.COST_FLOORS_TOLERANCE, BENCH.COST_MAX_AGE_Y, BENCH.COST_MIN_PROJECTS, GEN.VALUATION_DATE, F.CAPEX.NCS_BENCH]
    rationale: "При оценке нового участка каждый проект компании — одно наблюдение: крупный проект не должен перевешивать. Медиана устойчива к нетипичному проекту"
    rejected: ["Средневзвешенная по площади — подходит для портфельного отчёта, не для оценки нового проекта"]
    source_ids: [S_COMPANY_ACTUALS, S_NCS_2026_01]
    legacy: {cells: null, verdict: new}
    status: verified

  - id: F.BENCH.STATS
    module: BENCH
    name: "Статистика выборки и предупреждения"
    unit: руб/м2
    dims: []
    expr: |
      для любой выборки x (price_adj, comp_pace, cost_idx): n, MEDIAN, СРЕДНЕЕ, MIN, MAX, Q1, Q3 (QUARTILE.INC), CV = STDEV.S / СРЕДНЕЕ
      |СРЕДНЕЕ / MEDIAN − 1| > BENCH.WARN_MEAN_MEDIAN_GAP → требуется комментарий аналитика
      CV > BENCH.WARN_CV                                  → требуется комментарий аналитика
      IQR = Q3 − Q1;  x < Q1 − BENCH.OUTLIER_IQR_K × IQR  или  x > Q3 + BENCH.OUTLIER_IQR_K × IQR → выброс: подсвечивается,
      НЕ удаляется автоматически; исключение — только вручную с причиной (excluded, exclusion_reason), фиксируется в журнале
    depends_on: [F.BENCH.PRICE_ADJUSTED, F.BENCH.COMP_PACE, F.BENCH.COST_INDEXED, BENCH.WARN_MEAN_MEDIAN_GAP, BENCH.WARN_CV, BENCH.OUTLIER_IQR_K]
    rationale: "Аналитик и проверяющий видят не только итог, но и качество выборки: разброс, скошенность, выбросы. Автоматическое удаление выбросов скрыло бы решение, влияющее на цену; ручное исключение с причиной остаётся в журнале"
    rejected:
      - "Автоматически удалять выбросы — меняет результат без следа в журнале"
      - "Показывать только итоговое значение — нельзя оценить надёжность"
      - "Квартили по методу QUARTILE.EXC — на малых выборках не определены и не совпадают с формулами Excel в выгрузке"
    source_ids: [S_EXPERT]
    legacy: {cells: null, verdict: new}
    status: verified

  - id: F.BENCH.HEIGHT_BAND
    module: BENCH
    name: "Группа высотности здания"
    unit: enum
    dims: []
    expr: |
      band = «свыше_100м», если высота > height_max_m группы «26_плюс_до_100м» (100 м);
      иначе band — строка BENCH.HEIGHT_BAND, где floors_min <= этажность <= floors_max (floors_max = null — без верхней границы)
      этажность = TEP.MAX_FLOORS (для аналога — max_floors), высота = TEP.BUILDING_HEIGHT_M (для аналога — height_m)
    depends_on: [BENCH.HEIGHT_BAND, TEP.MAX_FLOORS, TEP.BUILDING_HEIGHT_M]
    rationale: "Стоимость и цена зависят от высотности скачками (конструктив, лифты, пожарные требования). Здание выше 100 м — уникальный объект (ч.2 ст.48.1 ГрК РФ) и с другими группами не смешивается"
    rejected: ["Сравнение по средней этажности — у комплекса с башней и малоэтажной частью среднее скрывает башню"]
    source_ids: [S_GRK_48_1, S_EXPERT, S_NCS_2026_01]
    legacy: {cells: null, verdict: new}
    status: needs_verification

  - id: F.BENCH.APART_PRICE
    module: BENCH
    name: "Цена апартаментов"
    unit: руб/м2
    dims: []
    expr: |
      аналогов-апартаментов (продукт = апартаменты) >= BENCH.MARKET_MIN_COMPS: apart_price = F.BENCH.MARKET_PRICE по этим аналогам
      иначе: discount = MEDIAN_j( apart_price_m2[j] / flat_price_m2[j] − 1 ) по парам BENCH.APART_PAIRS_SAMPLE в одной локации;
             apart_price = F.BENCH.MARKET_PRICE (квартиры) × (1 + discount), пометка «дисконт по парам»;
             ошибка, если пар < BENCH.MARKET_MIN_COMPS (сохранить только с экспертным обоснованием)
    depends_on: [F.BENCH.MARKET_PRICE, BENCH.APART_PAIRS_SAMPLE, BENCH.MARKET_MIN_COMPS]
    rationale: "Апартаменты — отдельный продукт: без семейной ипотеки, с НДС, с другим спросом. Цена — по прямым аналогам; если их мало — по наблюдаемому соотношению цен квартир и апартаментов в одной локации (уровень 3), а не по допущению"
    rejected: ["Фиксированный процент дисконта к квартирам без выборки — непроверяемое допущение"]
    source_ids: [S_EISZHS_SALES]
    legacy: {cells: null, verdict: new}
    status: verified
