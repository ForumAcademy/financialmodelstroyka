# Каталог формул расчётного ядра.
# Каждая формула — «паспорт»: что считаем, как, почему именно так, что отклонено, на чём основано, откуда пришло из исходника.
#
# Нотация выражений (язык-нейтральный псевдокод, реализуется 1:1 в packages/engine):
#   t            — индекс месяца (0..T-1), date[t] — последний день месяца
#   p            — очередь (phase), k — продукт/тип квартир, i — статья бюджета
#   X[t-1]       — значение в предыдущем месяце (для t=0 → 0)
#   Σ_t, Σ_k     — суммы по индексу
#   ID параметров — из parameters.yaml, ID формул — F.*
#   1{условие}   — индикатор (1 если истина, иначе 0)
#
# Поля: id, module, name, unit, dims, expr, depends_on, rationale (почему так), rejected (какие варианты отклонены и почему),
#       source_ids, legacy (ячейки исходника и вердикт), status (verified | needs_verification), example (контрольный пример).

formulas:

  # =====================================================================
  # TIME — временная шкала и флаги
  # =====================================================================

  - id: F.TIME.DATE
    module: TIME
    name: "Дата конца месяца t"
    unit: дата
    dims: [t]
    expr: "date[t] = EOMONTH(GEN.MODEL_START_DATE, t)"
    depends_on: [GEN.MODEL_START_DATE]
    rationale: "Единая месячная шкала для всех модулей; отчёты агрегируют месяцы в кварталы/годы"
    rejected:
      - "Квартальный шаг исходника: проценты и покрытие эскроу считаются грубо, раскрытие эскроу сдвигается до 3 месяцев"
    source_ids: [S_EXPERT]
    legacy: {cells: "CF1!E2:AS2", verdict: fix, issue: "F2 = EDATE, далее EOMONTH — разные функции в одном ряду"}
    status: verified

  - id: F.TIME.DAYS
    module: TIME
    name: "Дней в месяце t"
    unit: дни
    dims: [t]
    expr: "days[t] = date[t] - date[t-1]  (для t=0: DAY(date[0]))"
    depends_on: [F.TIME.DATE]
    rationale: "Проценты по кредиту начисляются по фактическим дням (факт/365), как в кредитных договорах"
    rejected: []
    source_ids: [S_BANK_TERMSHEET]
    legacy: {cells: "CF1!F3:AS3", verdict: keep}
    status: verified

  - id: F.TIME.FLAG_CONSTRUCTION
    module: TIME
    name: "Флаг периода строительства очереди"
    unit: "0/1"
    dims: [p, t]
    expr: "flag_constr[p,t] = 1{ construction_start[p] <= date[t] < construction_end[p] }"
    depends_on: [TIME.MILESTONES, F.TIME.DATE]
    rationale: "Сравнение настоящих дат; определяет выборку ПФ и распределение СМР"
    rejected:
      - "Текстовые вехи исходника («4 кв 2025») — сравнение даты с текстом всегда ложно, флаги строки CF1!4–5 были нулевыми"
    source_ids: [S_GRK_51]
    legacy: {cells: "CF1!F4:AS5", verdict: fix, issue: "D4, D5 ссылаются на текст ТЭПы!C7, C9"}
    status: verified

  - id: F.TIME.FLAG_PRESALE
    module: TIME
    name: "Флаг продаж по ДДУ (эскроу)"
    unit: "0/1"
    dims: [p, t]
    expr: "flag_ddu[p,t] = 1{ sales_start[p] <= date[t] < rnv_date[p] }"
    depends_on: [TIME.MILESTONES, F.TIME.DATE]
    rationale: "До РНВ продажи возможны только по ДДУ с эскроу (ст.15.4 214-ФЗ); старт — не раньше РНС (ст.51 ГрК) и публикации проектной декларации"
    rejected:
      - "Исходник: граница продаж по эскроу = «окончание ПФ» (CF1!D6), а не РНВ очереди; флаги AB8:AS8 перебиты нулями вручную"
    source_ids: [S_214_ART15_4, S_GRK_51, S_GRK_55]
    legacy: {cells: "CF1!F8:AS9", verdict: fix}
    status: verified

  - id: F.TIME.FLAG_POST_RNV
    module: TIME
    name: "Флаг продаж по ДКП (после РНВ)"
    unit: "0/1"
    dims: [p, t]
    expr: "flag_dkp[p,t] = 1{ date[t] >= rnv_date[p] }"
    depends_on: [TIME.MILESTONES, F.TIME.DATE]
    rationale: "После РНВ нераспроданные помещения продаются по ДКП, деньги поступают застройщику напрямую"
    rejected: []
    source_ids: [S_GRK_55]
    legacy: {cells: "CF1!F9:AS9", verdict: fix}
    status: verified

  - id: F.TIME.FLAG_ESCROW_RELEASE
    module: TIME
    name: "Флаг месяца раскрытия эскроу очереди"
    unit: "0/1"
    dims: [p, t]
    expr: "flag_release[p,t] = 1{ t == month_index(rnv_date[p]) + TIME.ESCROW_RELEASE_LAG_M }"
    depends_on: [TIME.MILESTONES, TIME.ESCROW_RELEASE_LAG_M]
    rationale: "ч.6 ст.15.5 214-ФЗ — перечисление не позднее 10 рабочих дней после РНВ; раскрытие по каждой очереди отдельно"
    rejected:
      - "Раскрытие одной датой для всех очередей по «окончанию ПФ» (исходник) — завышает процентные расходы по ранним очередям"
    source_ids: [S_214_ART15_5]
    legacy: {cells: "CF1!F6:AS6", verdict: fix, issue: "AB6 = 1 проставлено руками"}
    status: verified

  # =====================================================================
  # TEP — площади
  # =====================================================================

  - id: F.TEP.GFA_TOTAL
    module: TEP
    name: "ГНС общая"
    unit: м2
    dims: []
    expr: "gfa_total = TEP.GFA_ABOVE + gfa_below,  gfa_below = TEP.GFA_BELOW ?? F.TEP.GFA_BELOW_EST"
    depends_on: [TEP.GFA_ABOVE, TEP.GFA_BELOW, F.TEP.GFA_BELOW_EST]
    rationale: "Разделение на наземную и подземную части — у них разная стоимость СМР и разный охват НЦС"
    rejected: ["Одна «СПП (ГНС)» без разделения (исходник ТЭПы!C19)"]
    source_ids: [S_PROJECT_DOCS, S_NCS_TECHPART]
    legacy: {cells: "ТЭПы!C19", verdict: fix}
    status: verified

  - id: F.TEP.GFA_BELOW_EST
    module: TEP
    name: "Оценка подземной площади по числу машино-мест"
    unit: м2
    dims: []
    expr: "gfa_below_est = F.TEP.PARKING_COUNT × TEP.PARKING_AREA_PER_SPACE"
    depends_on: [F.TEP.PARKING_COUNT, TEP.PARKING_AREA_PER_SPACE]
    rationale: "Используется только если концепции подземной части ещё нет"
    rejected: []
    source_ids: [S_PROJECT_DOCS]
    legacy: {cells: "ТЭПы!E49, ТЭПы!C34", verdict: keep}
    status: verified
    example: {input: {parking: 862, area_per_space: 40.945}, output: 35294.59}

  - id: F.TEP.APT_TYPE_AREA
    module: TEP
    name: "Продаваемая площадь по типу квартир"
    unit: м2
    dims: [k]
    expr: "apt_area[k] = TEP.APT_MIX.count[k] × TEP.APT_MIX.avg_area[k]"
    depends_on: [TEP.APT_MIX]
    rationale: "Количество и средняя площадь — первичные данные квартирографии"
    rejected: []
    source_ids: [S_PROJECT_DOCS]
    legacy: {cells: "ТЭПы!E41:E43", verdict: keep}
    status: verified
    example: {input: {count: 961, avg_area: 35.108}, output: 33738.788}

  - id: F.TEP.APT_SHARE
    module: TEP
    name: "Доля типа квартир (по количеству)"
    unit: доля
    dims: [k]
    expr: "apt_share[k] = count[k] / Σ_k count[k]"
    depends_on: [TEP.APT_MIX]
    rationale: "Доля вычисляется — нельзя получить противоречие между долей и количеством"
    rejected: ["Ручной ввод долей (ТЭПы!C41:C43)"]
    source_ids: [S_PROJECT_DOCS]
    legacy: {cells: "ТЭПы!C41:C43", verdict: replace}
    status: verified

  - id: F.TEP.APT_AREA_CHECK
    module: TEP
    name: "Сверка площади квартир: квартирография vs ТЭП"
    unit: доля
    dims: []
    expr: "apt_check = Σ_k apt_area[k] / TEP.APT_AREA - 1;  предупреждение если |apt_check| > 1%"
    depends_on: [F.TEP.APT_TYPE_AREA, TEP.APT_AREA]
    rationale: "В исходнике площадь квартир вводилась дважды (квартирография ТЭПы!E44 и ТЭПы!C22); сейчас совпадает (143 560 м²), но при правках расхождение должно быть видно"
    rejected: []
    source_ids: [S_PROJECT_DOCS]
    legacy: {cells: "ТЭПы!E44 vs ТЭПы!C22", verdict: new}
    status: verified

  - id: F.TEP.PARKING_REQUIRED
    module: TEP
    name: "Требуемое количество машино-мест по нормативу региона"
    unit: шт
    dims: []
    expr: "parking_required = CEILING( Σ_k count[k] × norm(avg_area[k]) ), norm() — из TEP.PARKING_NORM региона"
    depends_on: [TEP.APT_MIX, TEP.PARKING_NORM]
    rationale: "Нормативы обеспеченности — обязательное требование РНГП; число мест определяет подземную часть и выручку"
    rejected: ["Вбитое число без документа (862 в исходнике при нормативе ≈ 2 785)"]
    source_ids: [S_MSK_PARKING_2118PP, S_SPB_NGP_257, S_SP_42_2026]
    legacy: {cells: "ТЭПы!J41:J44", verdict: fix, issue: "J44 перебит числом 862"}
    status: needs_verification
    example: {input: {counts: [961, 720, 720], norms: [0.8, 1.2, 1.6]}, output: 2785}

  - id: F.TEP.PARKING_COUNT
    module: TEP
    name: "Количество машино-мест в модели"
    unit: шт
    dims: []
    expr: "parking = TEP.PARKING_COUNT_OVERRIDE ?? F.TEP.PARKING_REQUIRED; если override < required — предупреждение «ниже норматива»"
    depends_on: [TEP.PARKING_COUNT_OVERRIDE, F.TEP.PARKING_REQUIRED]
    rationale: "Отклонение от норматива допустимо только по документу (ГПЗУ/ППТ/СТУ)"
    rejected: []
    source_ids: [S_PROJECT_DOCS]
    legacy: {cells: "ТЭПы!C27", verdict: fix}
    status: verified

  - id: F.TEP.SALEABLE_AREA
    module: TEP
    name: "Продаваемая площадь (м²)"
    unit: м2
    dims: []
    expr: "saleable = Σ_k apt_area[k] + TEP.COMM_AREA  (машино-места и кладовые — в штуках отдельно)"
    depends_on: [F.TEP.APT_TYPE_AREA, TEP.COMM_AREA]
    rationale: "Единое определение; машино-места не суммируются с м² квартир"
    rejected:
      - "Исходник: ТЭПы!C35 = 149 281 (число), Бюджет использует C22+C23 = 153 882, дашборд — 189 177 (с м² паркинга)"
    source_ids: [S_PROJECT_DOCS]
    legacy: {cells: "ТЭПы!C35, ТЭПы!E38, CF1!D11", verdict: fix}
    status: verified

  - id: F.TEP.LANDSCAPE_AREA
    module: TEP
    name: "Площадь благоустройства и её состав"
    unit: м2
    dims: []
    expr: "landscape = LAND.AREA × TEP.LANDSCAPE_SHARE; roads = landscape × TEP.ROAD_SHARE; green = landscape × TEP.GREEN_SHARE; ground_parking = landscape - roads - green"
    depends_on: [LAND.AREA, TEP.LANDSCAPE_SHARE, TEP.ROAD_SHARE, TEP.GREEN_SHARE]
    rationale: "База для статьи «Благоустройство»; проверка минимального озеленения по НГП"
    rejected: []
    source_ids: [S_PROJECT_DOCS, S_SP_42_2026]
    legacy: {cells: "ТЭПы!C29:C33", verdict: keep}
    status: verified

  # =====================================================================
  # LAND — земельные платежи
  # =====================================================================

  - id: F.LAND.TAX_COEF
    module: LAND
    name: "Повышающий коэффициент земельного налога"
    unit: коэф
    dims: [t]
    expr: "coef[t] = IF(NOT TAX.LAND_COEF_APPLY) 1 ELSE IF(years_since(land_acquired, date[t]) <= TIME.RNS_TO_RNV_TAX_YEARS) TAX.LAND_COEF_UP_TO_3Y ELSE TAX.LAND_COEF_OVER_3Y; действует до госрегистрации прав на объект (≈ handover_end последней очереди)"
    depends_on: [TAX.LAND_COEF_APPLY, TAX.LAND_COEF_UP_TO_3Y, TAX.LAND_COEF_OVER_3Y, TIME.MILESTONES]
    rationale: "п.15 ст.396 НК РФ; для участков > 300 млн руб. — позиция ФНС (письмо 25.08.2026)"
    rejected: ["Отсутствие коэффициентов (исходник) — налог занижен в 2–4 раза"]
    source_ids: [S_NK_396, S_FNS_LANDCOEF_2026]
    legacy: {cells: null, verdict: new}
    status: needs_verification

  - id: F.LAND.TAX_OR_RENT
    module: LAND
    name: "Земельный налог или аренда, помесячно"
    unit: руб
    dims: [t]
    expr: "IF LAND.TENURE = собственность: land_pay[t] = cad_value[year(t)] × TAX.LAND_RATE × F.LAND.TAX_COEF[t] / 12 × 1{land_acquired <= date[t] <= handover_end_last}
           IF LAND.TENURE = аренда: land_pay[t] = LAND.RENT_ANNUAL × index[year(t)] / 12 × 1{lease period}
           cad_value = LAND.CADASTRAL_VALUE_AFTER_VRI после смены ВРИ, иначе LAND.CADASTRAL_VALUE"
    depends_on: [LAND.TENURE, LAND.CADASTRAL_VALUE, LAND.CADASTRAL_VALUE_AFTER_VRI, TAX.LAND_RATE, F.LAND.TAX_COEF, LAND.RENT_ANNUAL]
    rationale: "Налог — от кадастровой стоимости (ст.390–391 НК РФ) по ставке муниципалитета; платёж только за период владения. Одна строка вместо двух в исходнике — нет двойного счёта"
    rejected:
      - "Равномерное деление итоговой суммы на 7,25 года (CF1!F24, F84) — игнорирует даты владения и коэффициенты"
      - "Одновременно «Аренда/налог ЗУ» и «Налог на имущество» 0,2% (исходник)"
    source_ids: [S_NK_394, S_NK_396, S_FNS_RATES, S_MSK_RENT_273PP, S_SPB_RENT_608]
    legacy: {cells: "CF1!F24:AH24, CF1!F84:AH84, CF1!B84", verdict: replace}
    status: needs_verification
    example: {input: {cad_value: 5834907660, rate: 0.015, coef: 2}, output_per_month: 14587269.15, note: "ставка 1,5% — пример для участка > 300 млн; фактическая — по ОКТМО"}

  - id: F.LAND.VRI_FEE
    module: LAND
    name: "Плата за изменение ВРИ"
    unit: руб
    dims: []
    expr: "vri_fee = region.vri_fee.exists ? region_formula(LAND.CADASTRAL_VALUE, LAND.CADASTRAL_VALUE_AFTER_VRI, ...) : 0;  Москва: от прироста кадастровой стоимости (КС2 − КС1) × коэффициент территории по приложению к ПП 593-ПП"
    depends_on: [GEN.REGION_CODE, LAND.CADASTRAL_VALUE, LAND.CADASTRAL_VALUE_AFTER_VRI]
    rationale: "Плата — региональная; привязка к приросту кадастровой стоимости делает её воспроизводимой"
    rejected: ["5 000 руб/м² ГНС (исходник Бюджет!D22) — экспертно, без источника"]
    source_ids: [S_MSK_VRI_593PP]
    legacy: {cells: "Бюджет!D22:F22", verdict: replace}
    status: needs_verification

  # =====================================================================
  # CAPEX — бюджет и график затрат
  # =====================================================================

  - id: F.CAPEX.ITEM_TOTAL
    module: CAPEX
    name: "Сумма статьи в ценах даты расценки"
    unit: руб
    dims: [i]
    expr: "item_total[i] = rate[i] × base_qty[i];  base_qty — значение параметра/формулы, указанной в capex_items.base (для «фикс» = 1)"
    depends_on: [CAPEX.ITEMS]
    rationale: "Сумма всегда выводится из ставки и объёма — любую цифру можно объяснить"
    rejected:
      - "Вбитая сумма + обратный расчёт расценки D = F/E (исходник Бюджет!D17:D49) — расценка не проверяема"
    source_ids: [S_COMPANY_ACTUALS, S_NCS_2026_01]
    legacy: {cells: "Бюджет!D17:F49", verdict: replace}
    status: verified

  - id: F.CAPEX.INDEX
    module: CAPEX
    name: "Индекс пересчёта из цен даты расценки в цены месяца t"
    unit: коэф
    dims: [i, t]
    expr: "index[i,t] = Π по годам y от price_date[i] до date[t] (1 + CAPEX.COST_INDEX[y]) ^ (доля года y в интервале)"
    depends_on: [CAPEX.COST_INDEX, CAPEX.ITEMS]
    rationale: "Стройка длится 3–6 лет; без индексации затраты занижены. Индексы — прогноз МЭР / Минстроя"
    rejected: ["Отсутствие индексации (исходник)"]
    source_ids: [S_MINEC_SCENARIO_2027, S_FGISCS]
    legacy: {cells: null, verdict: new}
    status: verified

  - id: F.CAPEX.SCHEDULE_WEIGHT
    module: CAPEX
    name: "Вес месяца в графике статьи"
    unit: доля
    dims: [i, t]
    expr: "uniform: w = 1/N в месяцах [from, to);  s_curve: x_t = (t - t_from + 1)/N, C(x) = 3x² − 2x³, w = C(x_t) − C(x_{t-1});  at_milestone: w = 1 в месяце вехи;  follow_smr: w = smr_cash[t] / Σ smr_cash;  follow_sales: w = sales_value[t] / Σ sales_value;  manual: ряд пользователя. Проверка Σ_t w = 1"
    depends_on: [CAPEX.ITEMS, TIME.MILESTONES]
    rationale: "График привязан к вехам: сдвиг РНС автоматически сдвигает затраты. S-кривая C(x) = 3x²−2x³ — симметричная кривая освоения с пиком в середине стройки"
    rejected:
      - "Ручные проценты по кварталам (исходник CF1 строки «Проставить темп,%») — не двигаются вместе с датами, суммы рядов ≠ 100% не контролируются"
    source_ids: [S_EXPERT]
    legacy: {cells: "CF1!F22:AS76 (строки «Проставить темп»)", verdict: replace, issue: "ряды сохранены в tests/cases как manual для сверки"}
    status: verified
    example: {input: {rule: s_curve, N: 4}, output: [0.15625, 0.34375, 0.34375, 0.15625]}

  - id: F.CAPEX.ITEM_CASH
    module: CAPEX
    name: "Платёж по статье в месяце t (с НДС)"
    unit: руб
    dims: [i, t]
    expr: "item_cash[i,t] = item_total[i] × w[i,t] × index[i,t] × (vat_included[i] ? 1 : 1 + TAX.VAT_RATE × vat_applicable[i])"
    depends_on: [F.CAPEX.ITEM_TOTAL, F.CAPEX.SCHEDULE_WEIGHT, F.CAPEX.INDEX, TAX.VAT_RATE]
    rationale: "Денежный поток — с НДС (так платят подрядчикам); вычитаемая часть НДС возвращается в модуле TAX"
    rejected: ["Смешение сумм с НДС и без НДС в исходнике (не указано)"]
    source_ids: [S_NK_164]
    legacy: {cells: "CF1!F21:AS76 (нечётные строки)", verdict: fix}
    status: verified

  - id: F.CAPEX.SMR_TOTAL
    module: CAPEX
    name: "Итого СМР (без НДС, в ценах расценок)"
    unit: руб
    dims: []
    expr: "smr_total = Σ item_total[i] для group ∈ {СМР, сети, благоустройство, соцобъекты}"
    depends_on: [F.CAPEX.ITEM_TOTAL]
    rationale: "База для процентных статей (техзаказчик, стройконтроль, резерв)"
    rejected: ["База техзаказчика — выручка (исходник Бюджет!E43)"]
    source_ids: [S_MINSTROY_297]
    legacy: {cells: "Бюджет!F30", verdict: fix}
    status: verified

  - id: F.CAPEX.NCS_BENCH
    module: CAPEX
    name: "Контроль СМР надземной части по НЦС"
    unit: руб
    dims: []
    expr: "ncs_bench = NCS_per_m2(класс, этажность) × TEP.GFA_ABOVE × region.ncs_k_per × К_рег × К_с × Ипр;  deviation = item_total[SMR_ABOVE] / ncs_bench − 1; |deviation| > CAPEX.NCS_BENCH_TOLERANCE → требуется обоснование"
    depends_on: [TEP.GFA_ABOVE, GEN.REGION_CODE, CAPEX.NCS_BENCH_TOLERANCE]
    rationale: "Формула пересчёта НЦС по п.40 техчасти: С = [(НЦС×М×Кпер×Кпер/зон×Крег×Кс)+Зр]×Ипр+НДС. В НЦС уже учтены ПИР, стройконтроль, резерв — при сравнении их нужно добавить к расценке компании"
    rejected: []
    source_ids: [S_NCS_2026_01, S_NCS_TECHPART]
    legacy: {cells: null, verdict: new}
    status: needs_verification

  - id: F.CAPEX.TOTAL
    module: CAPEX
    name: "Итого бюджет"
    unit: руб
    dims: []
    expr: "capex_total = Σ_i Σ_t item_cash[i,t];  проверка: = Σ бюджет по группам (CHECK.BUDGET_EQ_CF)"
    depends_on: [F.CAPEX.ITEM_CASH]
    rationale: "Итог бюджета и итог денежного потока — одно число"
    rejected: ["Бюджет и CF1 расходятся (исходник: УДС 535,6 млн есть в бюджете, нет в CF1)"]
    source_ids: [S_EXPERT]
    legacy: {cells: "Бюджет!F59, CF1!C18", verdict: fix}
    status: verified

  # =====================================================================
  # SALES — план продаж
  # =====================================================================

  - id: F.SALES.SOLD_AREA
    module: SALES
    name: "Продано в месяце, м² (шт для м/м)"
    unit: м2
    dims: [k, p, t]
    expr: "sold[k,t] = MIN( pace[k,t], remaining[k,t-1] ) × 1{ flag_ddu[p,t] OR flag_dkp[p,t] };  remaining[k,t] = stock[k] − Σ_{τ<=t} sold[k,τ]"
    depends_on: [SALES.PACE, SALES.PRODUCTS, F.TIME.FLAG_PRESALE, F.TIME.FLAG_POST_RNV]
    rationale: "Нельзя продать больше, чем построено; продажи — только в разрешённый период"
    rejected: ["Темпы без ограничения остатком (исходник)"]
    source_ids: [S_EISZHS_SALES]
    legacy: {cells: "План продаж!E28:AU54", verdict: fix}
    status: verified

  - id: F.SALES.PRICE
    module: SALES
    name: "Цена 1 м² в месяце t"
    unit: руб/м2
    dims: [k, t]
    expr: "price[k,t] = start_price[k] × Π_{τ<=t} (1 + g_month[τ]) × stage_factor(progress[p,t]);  g_month = (1 + SALES.PRICE_MARKET_GROWTH[year])^(1/12) − 1;  stage_factor — произведение надбавок SALES.PRICE_STAGE_UPLIFT пройденных стадий; progress = накопленные СМР / СМР итого по очереди"
    depends_on: [SALES.PRODUCTS, SALES.PRICE_MARKET_GROWTH, SALES.PRICE_STAGE_UPLIFT, F.CAPEX.ITEM_CASH]
    rationale: "Цена растёт по двум причинам: рынок (инфляция цен) и снижение риска по мере готовности. Раздельно — чтобы сценарии были осмысленны"
    rejected: ["Константа 2%/квартал на весь срок (исходник) — за 29 кварталов +77%, без связи со стройкой и рынком"]
    source_ids: [S_EISZHS_SERIES, S_MINEC_SCENARIO_2027]
    legacy: {cells: "План продаж!E31:AM56", verdict: replace}
    status: verified

  - id: F.SALES.CONTRACT_VALUE
    module: SALES
    name: "Стоимость договоров, заключённых в месяце t"
    unit: руб
    dims: [k, p, t]
    expr: "value[k,t] = sold[k,t] × price[k,t]"
    depends_on: [F.SALES.SOLD_AREA, F.SALES.PRICE]
    rationale: "Выручка по подписанным договорам (с НДС, если продукт облагается)"
    rejected: []
    source_ids: [S_EXPERT]
    legacy: {cells: "План продаж!E27, E32, E37, E42, E47, E52", verdict: keep}
    status: verified

  - id: F.SALES.CASH_IN
    module: SALES
    name: "Поступления от покупателей по графику оплат"
    unit: руб
    dims: [k, p, t]
    expr: "cash_in[t] = Σ_{τ<=t} value[τ] × ( (mortgage_share + full_share) × 1{t=τ} + installment_share × ( down × 1{t=τ} + (1−down)/n × 1{τ < t <= τ+n} ) ), n = installment_months"
    depends_on: [F.SALES.CONTRACT_VALUE, SALES.PAYMENT_MIX]
    rationale: "Ипотека и 100% оплата поступают в месяц сделки; рассрочка — первоначальный взнос + равные платежи. Проверка: сумма долей = 1"
    rejected: ["Структура оплат на листе «Эскроу» не связана с CF1 и не сходится к 100% (исходник 0,7+0,1+0)"]
    source_ids: [S_CBR_MORTGAGE]
    legacy: {cells: "Эскроу!C5:AL33", verdict: replace}
    status: verified

  - id: F.SALES.WAVG_PRICE
    module: SALES
    name: "Средневзвешенная цена продаж"
    unit: руб/м2
    dims: [k]
    expr: "wavg_price[k] = Σ_t value[k,t] / Σ_t sold[k,t]"
    depends_on: [F.SALES.CONTRACT_VALUE, F.SALES.SOLD_AREA]
    rationale: "Средняя цена должна учитывать объёмы продаж в каждом периоде"
    rejected: ["AVERAGE цен по периодам (исходник План продаж!D31, D66) — период без продаж весит как пиковый"]
    source_ids: [S_EXPERT]
    legacy: {cells: "План продаж!D31, D36, D41, D66", verdict: replace}
    status: verified

  - id: F.SALES.END_PRICE
    module: SALES
    name: "Цена в конце продаж"
    unit: руб/м2
    dims: [k]
    expr: "end_price[k] = price[k, t_last_sale[k]], t_last_sale — последний месяц с sold > 0"
    depends_on: [F.SALES.PRICE, F.SALES.SOLD_AREA]
    rationale: "Фактический последний месяц продаж"
    rejected: ["Фиксированный столбец S (исходник План продаж!D65)"]
    source_ids: [S_EXPERT]
    legacy: {cells: "План продаж!D65", verdict: replace}
    status: verified

  - id: F.SALES.REVENUE_TOTAL
    module: SALES
    name: "Выручка итого (с НДС) и без НДС"
    unit: руб
    dims: []
    expr: "revenue_gross = Σ_{k,t} value[k,t];  revenue_net = revenue_gross − Σ output_vat"
    depends_on: [F.SALES.CONTRACT_VALUE, F.TAX.OUTPUT_VAT]
    rationale: "Итог плана продаж = итог выручки в CF (CHECK.REVENUE_EQ_CF)"
    rejected: ["Исходник: план продаж 118,13 млрд, CF1 117,51 млрд — продажи после столбца AH не перенесены (−616 млн)"]
    source_ids: [S_EXPERT]
    legacy: {cells: "План продаж!D25, Бюджет!F12, CF1!C15", verdict: fix}
    status: verified

  # =====================================================================
  # ESCROW
  # =====================================================================

  - id: F.ESC.DEPOSIT
    module: ESCROW
    name: "Пополнение эскроу"
    unit: руб
    dims: [p, t]
    expr: "deposit[p,t] = Σ_k cash_in[k,p,t] по договорам ДДУ (заключённым при flag_ddu)"
    depends_on: [F.SALES.CASH_IN, F.TIME.FLAG_PRESALE]
    rationale: "Все платежи по ДДУ, включая рассрочку, поступают на эскроу (ст.15.4 214-ФЗ)"
    rejected: []
    source_ids: [S_214_ART15_4]
    legacy: {cells: "CF1!F92:AS92", verdict: keep}
    status: verified

  - id: F.ESC.BALANCE
    module: ESCROW
    name: "Остаток на эскроу на конец месяца"
    unit: руб
    dims: [p, t]
    expr: "esc_bal[p,t] = esc_bal[p,t-1] + deposit[p,t] − release[p,t];  release[p,t] = flag_release[p,t] × (esc_bal[p,t-1] + deposit[p,t]) + 1{t > t_release[p]} × deposit[p,t]"
    depends_on: [F.ESC.DEPOSIT, F.TIME.FLAG_ESCROW_RELEASE]
    rationale: "Раскрытие по очереди; платежи рассрочки после раскрытия проходят «транзитом» и раскрываются в том же месяце"
    rejected: ["Один общий счёт на все очереди (исходник)"]
    source_ids: [S_214_ART15_5]
    legacy: {cells: "CF1!F91:AS94", verdict: fix}
    status: verified

  - id: F.ESC.COVERAGE
    module: ESCROW
    name: "Покрытие долга остатками эскроу"
    unit: доля
    dims: [t]
    expr: "coverage[t] = Σ_p esc_bal_avg[p,t] × (1 − FIN.ESCROW_RESERVE_RATE) / (debt_avg[t] + accrued_interest[t-1]),  esc_bal_avg = (bal[t-1]+bal[t])/2"
    depends_on: [F.ESC.BALANCE, F.FIN.DEBT, F.FIN.INTEREST]
    rationale: "Коэффициент К1 для ставки ПФ; средние остатки за период — как в методике исходника и кредитных договорах"
    rejected: []
    source_ids: [S_BANK_TERMSHEET, S_CBR_PF_STATS]
    legacy: {cells: "CF1!F120:AS122", verdict: keep}
    status: verified

  # =====================================================================
  # FIN — проектное финансирование
  # =====================================================================

  - id: F.FIN.EQUITY_REQUIRED
    module: FIN
    name: "Требуемое собственное участие"
    unit: руб
    dims: []
    expr: "equity_req = FIN.EQUITY_SHARE × capex_total (включая стоимость участка)"
    depends_on: [FIN.EQUITY_SHARE, F.CAPEX.TOTAL]
    rationale: "Банк требует внести собственные средства ДО первой выборки кредита; земля обычно засчитывается в собственное участие"
    rejected: ["10% от расходов каждого периода (исходник CF1!G132)"]
    source_ids: [S_214_ART3, S_BANK_TERMSHEET]
    legacy: {cells: "CF1!D132:AS132, Бюджет!F65", verdict: fix}
    status: needs_verification

  - id: F.FIN.FUNDING_NEED
    module: FIN
    name: "Потребность в финансировании месяца"
    unit: руб
    dims: [t]
    expr: "need[t] = MAX(0, capex_cash[t] + opex_cash[t] + taxes_paid[t] + fees[t] − dkp_cash[t] − released_to_developer[t] − cash_bal[t-1])"
    depends_on: [F.CAPEX.ITEM_CASH, F.TAX.PAYMENTS, F.ESC.BALANCE]
    rationale: "Сначала используются собственные поступления, затем собственный капитал, затем кредит"
    rejected: []
    source_ids: [S_EXPERT]
    legacy: {cells: "CF1!F98", verdict: fix}
    status: verified

  - id: F.FIN.EQUITY_IN
    module: FIN
    name: "Взнос собственного капитала"
    unit: руб
    dims: [t]
    expr: "equity_in[t] = MIN(need[t], equity_req − Σ_{τ<t} equity_in[τ]) пока накопленный взнос < equity_req; после первой выборки — только на покрытие дефицита вне лимита (cash gap)"
    depends_on: [F.FIN.FUNDING_NEED, F.FIN.EQUITY_REQUIRED]
    rationale: "Очерёдность: собственные средства → кредит"
    rejected: []
    source_ids: [S_BANK_TERMSHEET]
    legacy: {cells: "CF1!F132:AS132", verdict: replace}
    status: verified

  - id: F.FIN.LIMIT
    module: FIN
    name: "Лимит проектного финансирования"
    unit: руб
    dims: []
    expr: "limit = capex_total_financeable − equity_req  (без капитализированных процентов — они учитываются отдельно как PIK)"
    depends_on: [F.CAPEX.TOTAL, F.FIN.EQUITY_REQUIRED]
    rationale: "Лимит покрывает бюджет за вычетом собственного участия; проценты капитализируются и гасятся при раскрытии эскроу — как в исходнике (строки 107–110)"
    rejected: ["Лимит = СМР + ПИР + участок + коммерческие + налоги (исходник Бюджет!F67) — включает участок, уже оплаченный собственными средствами"]
    source_ids: [S_BANK_TERMSHEET]
    legacy: {cells: "Бюджет!F67, CF1!C98", verdict: fix}
    status: verified

  - id: F.FIN.DRAW
    module: FIN
    name: "Выборка кредита"
    unit: руб
    dims: [t]
    expr: "draw[t] = MIN(need[t] − equity_in[t], limit − Σ_{τ<t} draw[τ]) × 1{ Σ equity_in >= equity_req } × 1{ t < t_release_last }"
    depends_on: [F.FIN.FUNDING_NEED, F.FIN.EQUITY_IN, F.FIN.LIMIT]
    rationale: "Выборка после внесения собственного участия и в пределах лимита"
    rejected: []
    source_ids: [S_BANK_TERMSHEET]
    legacy: {cells: "CF1!F98:AS98", verdict: fix, issue: "в исходнике зависела от флага эскроу F8, который перебит нулями"}
    status: verified

  - id: F.FIN.RATE
    module: FIN
    name: "Текущая ставка ПФ"
    unit: "%годовых"
    dims: [t]
    expr: "K1[t] = MIN(coverage[t-1], 1);  K2[t] = 1 − K1[t];  base_rate[t] = FIN.KEY_RATE_PATH[t] + FIN.RATE_BASE_SPREAD;  SkR[t] = MAX((esc − (debt+accr))/(debt+accr) × FIN.RATE_DISCOUNT_COEF, 0);  rate[t] = MAX(FIN.RATE_PREFERENTIAL × K1 + base_rate × K2 − SkR, FIN.RATE_MIN)"
    depends_on: [F.ESC.COVERAGE, FIN.KEY_RATE_PATH, FIN.RATE_BASE_SPREAD, FIN.RATE_PREFERENTIAL, FIN.RATE_DISCOUNT_COEF, FIN.RATE_MIN]
    rationale: "Рыночная механика ПФ с эскроу: льготная ставка на покрытую часть, базовая (ключевая + спред) на непокрытую. Покрытие берётся за прошлый месяц — нет циклической ссылки"
    rejected: ["Фиксированная базовая ставка 20% при ключевой 14,25% (исходник) — сценарий ставки ЦБ не влияет на проект"]
    source_ids: [S_BANK_TERMSHEET, S_CBR_PF_STATS, S_CBR_KEYRATE]
    legacy: {cells: "CF1!F115:AS125", verdict: fix}
    status: verified
    example: {input: {pref: 0.05, key: 0.14, spread: 0.0575, coverage: 0.4, skr: 0, min: 0.001}, output: 0.1385}

  - id: F.FIN.INTEREST
    module: FIN
    name: "Проценты начисленные (капитализируемые)"
    unit: руб
    dims: [t]
    expr: "interest[t] = ( (debt[t-1] + (debt[t-1] + draw[t]))/2 + accrued[t-1] ) × rate[t] × days[t] / 365;  accrued[t] = accrued[t-1] + interest[t] − interest_paid[t]"
    depends_on: [F.FIN.RATE, F.FIN.DRAW, F.TIME.DAYS]
    rationale: "Методика исходника (строка 107) сохранена: проценты на средний долг + начисленные ранее (сложный процент при капитализации)"
    rejected: []
    source_ids: [S_BANK_TERMSHEET]
    legacy: {cells: "CF1!F107:AS110", verdict: keep}
    status: verified

  - id: F.FIN.REPAYMENT
    module: FIN
    name: "Погашение долга и процентов"
    unit: руб
    dims: [t]
    expr: "from_escrow[t] = MIN(Σ_p release[p,t], debt[t-1] + draw[t] + accrued[t]) — сначала проценты, затем тело;  from_dkp[t] = MIN(dkp_cash[t] (100% sweep), остаток долга) после t_release;  debt[t] = debt[t-1] + draw[t] − principal_repaid[t]"
    depends_on: [F.ESC.BALANCE, F.FIN.DRAW, F.FIN.INTEREST, F.SALES.CASH_IN]
    rationale: "ч.6 ст.15.5 214-ФЗ позволяет направлять средства эскроу в погашение кредита; остаток долга гасится из ДКП"
    rejected: ["Погашение по залоговой стоимости (исходник строки 102–105) не доведено до формул"]
    source_ids: [S_214_ART15_5, S_BANK_TERMSHEET]
    legacy: {cells: "CF1!F99:AS106, F108:AS109", verdict: fix, issue: "AA109:AB109 ссылаются на соседний столбец (AB85 вместо AA85)"}
    status: verified

  - id: F.FIN.DEBT
    module: FIN
    name: "Остаток основного долга"
    unit: руб
    dims: [t]
    expr: "debt[t] = debt[t-1] + draw[t] − principal_repaid[t];  debt_avg[t] = (debt[t-1] + debt[t-1] + draw[t]) / 2"
    depends_on: [F.FIN.DRAW, F.FIN.REPAYMENT]
    rationale: "Баланс долга BoP → EoP"
    rejected: []
    source_ids: [S_BANK_TERMSHEET]
    legacy: {cells: "CF1!F97:AS97, F106:AS106", verdict: keep}
    status: verified

  - id: F.FIN.FEES
    module: FIN
    name: "Комиссии банка"
    unit: руб
    dims: [t]
    expr: "fee_arr[t] = FIN.FEE_ARRANGEMENT × limit × 1{t = t_first_draw};  fee_commit[t] = FIN.FEE_COMMIT × (limit − Σ draw) × days[t]/365 × 1{availability}"
    depends_on: [F.FIN.LIMIT, F.FIN.DRAW, FIN.FEE_ARRANGEMENT, FIN.FEE_COMMITMENT]
    rationale: "Стандартные комиссии кредитного договора"
    rejected: ["«Банковские расходы 15% от ПФ» (исходник Бюджет!F68) — дублирует проценты"]
    source_ids: [S_BANK_TERMSHEET]
    legacy: {cells: "CF1!F111:AS112, Бюджет!D68:F68", verdict: fix}
    status: verified

  - id: F.FIN.EFFECTIVE_RATE
    module: FIN
    name: "Эффективная стоимость кредита"
    unit: "%годовых"
    dims: []
    expr: "eff_rate = XIRR( bank_flow[t] = draw[t] − repaid_principal[t] − interest_paid[t] − fees[t] (с позиции банка знак обратный), date[t] )"
    depends_on: [F.FIN.DRAW, F.FIN.REPAYMENT, F.FIN.FEES]
    rationale: "XIRR по датам — корректен при неравных периодах"
    rejected: ["(1+IRR квартальный)^4 − 1 (исходник D128) — допустимо только при равных периодах"]
    source_ids: [S_EXPERT]
    legacy: {cells: "CF1!D128", verdict: fix}
    status: verified

  # =====================================================================
  # TAX
  # =====================================================================

  - id: F.TAX.OUTPUT_VAT
    module: TAX
    name: "НДС с реализации"
    unit: руб
    dims: [k, t]
    expr: "output_vat[k,t] = value[k,t] × TAX.VAT_RATE / (1 + TAX.VAT_RATE) × taxable(k, channel(t));  taxable — из TAX.VAT_REGIME"
    depends_on: [F.SALES.CONTRACT_VALUE, TAX.VAT_RATE, TAX.VAT_REGIME]
    rationale: "Цена в договоре включает НДС → выделение 22/122. Облагаются только продукты/каналы из таблицы режима"
    rejected: ["22% «сверху» от цены с НДС по всей выручке ПСН+ММ (исходник План продаж!E61)"]
    source_ids: [S_NK_149, S_NK_164, S_MINFIN_VAT_DDU_2023]
    legacy: {cells: "План продаж!D60:AM61", verdict: fix}
    status: needs_verification
    example: {input: {value: 1220, rate: 0.22}, output: 220}

  - id: F.TAX.INPUT_VAT_SHARE
    module: TAX
    name: "Доля входящего НДС к вычету"
    unit: доля
    dims: []
    expr: "input_share = TAX.INPUT_VAT_RECOVERABLE ?? (Σ облагаемая выручка без НДС / Σ вся выручка без НДС)"
    depends_on: [TAX.INPUT_VAT_RECOVERABLE, F.TAX.OUTPUT_VAT, F.SALES.REVENUE_TOTAL]
    rationale: "Раздельный учёт (п.4 ст.170 НК РФ): НДС по освобождённым операциям включается в стоимость"
    rejected: []
    source_ids: [S_NK_149, S_MINFIN_VAT_DDU_2023]
    legacy: {cells: null, verdict: new}
    status: needs_verification

  - id: F.TAX.VAT_PAYABLE
    module: TAX
    name: "НДС к уплате / возмещению"
    unit: руб
    dims: [quarter]
    expr: "vat_q = Σ_{t∈q} output_vat[t] − Σ_{t∈q} input_vat[t] × input_share;  уплата — равными долями в 3 месяца, следующих за кварталом (vat_q > 0); возмещение — через 3 месяца после квартала (vat_q < 0)"
    depends_on: [F.TAX.OUTPUT_VAT, F.CAPEX.ITEM_CASH, F.TAX.INPUT_VAT_SHARE]
    rationale: "Налоговый период по НДС — квартал; порядок уплаты — ст.174 НК РФ"
    rejected: ["5 млн в квартал вручную (исходник CF1!M85:AA85)"]
    source_ids: [S_NK_164, S_NK_174]
    legacy: {cells: "CF1!F85:AS85, Бюджет!F54", verdict: replace}
    status: needs_verification

  - id: F.TAX.PROFIT_BASE
    module: TAX
    name: "Налоговая база по налогу на прибыль"
    unit: руб
    dims: [t]
    expr: "ДДУ: economy[p] = Σ средства ДДУ очереди p без НДС − затраты на передаваемые объекты очереди p (распределение общих затрат пропорционально продаваемой площади); признаётся в месяце handover_end[p].
           ДКП: profit_dkp[t] = выручка ДКП без НДС − себестоимость проданных площадей (средняя себестоимость м² × проданная площадь) в месяце продажи.
           Прочие расходы, не относящиеся к целевому финансированию, — в периоде возникновения.
           base[t] = economy × 1{t = handover_end} + profit_dkp[t] − other_expenses[t]"
    depends_on: [F.SALES.CONTRACT_VALUE, F.CAPEX.TOTAL, F.FIN.INTEREST, TIME.MILESTONES]
    rationale: "Средства дольщиков — целевое финансирование (пп.14 п.1 ст.251 НК РФ); финрез (экономия) — внереализационный доход в периоде исполнения всех обязательств по ДДУ (письмо Минфина от 28.07.2026 № 03-03-08/65074)"
    rejected:
      - "5,7% от выручки (исходник Бюджет!M55)"
      - "(выручка − расходы − собственный капитал) × 25% (исходник Бюджет!J55:K55) — капитал не уменьшает базу"
    source_ids: [S_NK_251, S_MINFIN_PROFIT_DDU_2026]
    legacy: {cells: "Бюджет!F55, J55:M55, CF1!AB86", verdict: replace}
    status: needs_verification

  - id: F.TAX.PROFIT_TAX
    module: TAX
    name: "Налог на прибыль с учётом переноса убытков"
    unit: руб
    dims: [year]
    expr: "loss_used[y] = MIN(loss_cf[y-1], MAX(base[y],0) × TAX.LOSS_CARRYFORWARD_LIMIT);  tax[y] = (MAX(base[y],0) − loss_used[y]) × TAX.PROFIT_RATE;  loss_cf[y] = loss_cf[y-1] − loss_used[y] + MAX(−base[y],0);  уплата — в марте следующего года (упрощение; авансовые платежи — опция)"
    depends_on: [F.TAX.PROFIT_BASE, TAX.PROFIT_RATE, TAX.LOSS_CARRYFORWARD_LIMIT]
    rationale: "Ставка 25% (ст.284), ограничение переноса убытков (ст.283)"
    rejected: []
    source_ids: [S_NK_284, S_NK_283]
    legacy: {cells: "CF1!AB86", verdict: replace, issue: "весь налог одной суммой в квартале AB"}
    status: needs_verification

  - id: F.TAX.PAYMENTS
    module: TAX
    name: "Налоговые платежи месяца"
    unit: руб
    dims: [t]
    expr: "taxes_paid[t] = vat_paid[t] − vat_refund[t] + profit_tax_paid[t] + land_pay[t]"
    depends_on: [F.TAX.VAT_PAYABLE, F.TAX.PROFIT_TAX, F.LAND.TAX_OR_RENT]
    rationale: "Единая строка налогов в CF"
    rejected: ["Налог на имущество 0,2% кадастровой стоимости земли (исходник CF1!84): объект незавершённого строительства и квартиры-товары налогом на имущество по кадастровой стоимости у застройщика в общем случае не облагаются; земля облагается земельным налогом"]
    source_ids: [S_NK_394]
    legacy: {cells: "CF1!F81:AS86", verdict: replace}
    status: needs_verification

  # =====================================================================
  # CF — денежный поток
  # =====================================================================

  - id: F.CF.CFADS
    module: CF
    name: "Денежный поток проекта до финансирования"
    unit: руб
    dims: [t]
    expr: "cfads[t] = Σ_p release[p,t] + dkp_cash[t] − Σ_i item_cash[i,t] − taxes_paid[t]"
    depends_on: [F.ESC.BALANCE, F.SALES.CASH_IN, F.CAPEX.ITEM_CASH, F.TAX.PAYMENTS]
    rationale: "Деньги дольщиков доступны застройщику только после раскрытия эскроу — поэтому в CFADS входит раскрытие, а не продажи"
    rejected: ["Выручка по дате продажи (исходник CF1!F133 = F15 − F18 − F81) — завышает CF до РНВ"]
    source_ids: [S_214_ART15_5]
    legacy: {cells: "CF1!F133:AS133", verdict: fix}
    status: verified

  - id: F.CF.FCFE
    module: CF
    name: "Денежный поток акционера"
    unit: руб
    dims: [t]
    expr: "fcfe[t] = cfads[t] + draw[t] − principal_repaid[t] − interest_paid[t] − fees[t];  отрицательные значения = взносы акционера (equity_in + cash gap), положительные = распределения"
    depends_on: [F.CF.CFADS, F.FIN.DRAW, F.FIN.REPAYMENT, F.FIN.FEES]
    rationale: "Стандартное определение FCFE"
    rejected: ["FCFE = ΔCash − upfront equity (исходник CF1!F138) — зависит от остатка кэша"]
    source_ids: [S_EXPERT]
    legacy: {cells: "CF1!F138:AS138", verdict: replace}
    status: verified

  - id: F.CF.CASH_BALANCE
    module: CF
    name: "Остаток денежных средств"
    unit: руб
    dims: [t]
    expr: "cash[t] = cash[t-1] + fcfe[t] + equity_in[t] − distributions[t];  CHECK: cash[t] >= 0, иначе cash_gap[t] = −cash[t] покрывается акционером"
    depends_on: [F.CF.FCFE, F.FIN.EQUITY_IN]
    rationale: "Разрыв ликвидности должен быть виден явно"
    rejected: []
    source_ids: [S_EXPERT]
    legacy: {cells: "CF1!F134:AS137", verdict: fix}
    status: verified

  # =====================================================================
  # KPI — показатели
  # =====================================================================

  - id: F.KPI.DISCOUNT_RATE
    module: KPI
    name: "Ставка дисконтирования"
    unit: "%годовых"
    dims: []
    expr: "r = VAL.RISK_FREE + VAL.EQUITY_PREMIUM"
    depends_on: [VAL.RISK_FREE, VAL.EQUITY_PREMIUM]
    rationale: "Кумулятивный подход: доходность ОФЗ + премия за риск; каждая часть имеет свой источник"
    rejected: ["Cost of equity 25% одной цифрой (исходник CF1!D139)"]
    source_ids: [S_CBR_ZCYC, S_EXPERT]
    legacy: {cells: "CF1!D139", verdict: replace}
    status: verified

  - id: F.KPI.NPV
    module: KPI
    name: "NPV проекта и акционера"
    unit: руб
    dims: []
    expr: "npv_project = Σ_t cfads[t] / (1+r)^((date[t] − GEN.VALUATION_DATE)/365);  npv_equity = то же для fcfe[t]"
    depends_on: [F.CF.CFADS, F.CF.FCFE, F.KPI.DISCOUNT_RATE, GEN.VALUATION_DATE]
    rationale: "Дисконтирование по фактическим датам (XNPV)"
    rejected: ["NPV = финрез (исходник Бюджет!F63) — без учёта времени"]
    source_ids: [S_EXPERT]
    legacy: {cells: "Бюджет!F63, Dashboard!C57, CF1!D148", verdict: replace}
    status: verified

  - id: F.KPI.IRR
    module: KPI
    name: "IRR проекта и акционера"
    unit: "%годовых"
    dims: []
    expr: "irr_project = XIRR(cfads[t], date[t]);  irr_equity = XIRR(fcfe[t], date[t])"
    depends_on: [F.CF.CFADS, F.CF.FCFE]
    rationale: "IRR — ставка, обнуляющая NPV"
    rejected:
      - "«IRR» = финрез / затраты (исходник Бюджет!F64, Dashboard!C44) — это ROI"
      - "«IRR продаж» = прибыль / выручка (Dashboard!C43) — это маржа"
    source_ids: [S_EXPERT]
    legacy: {cells: "Бюджет!F64, Dashboard!C43:C45, CF1!C143", verdict: replace}
    status: verified

  - id: F.KPI.MARGIN
    module: KPI
    name: "Прибыль и маржа"
    unit: "руб / доля"
    dims: []
    expr: "gross_profit = revenue_net − capex_total_net;  net_profit = gross_profit − Σ interest − Σ fees − Σ profit_tax;  gross_margin = gross_profit / revenue_net;  net_margin = net_profit / revenue_net;  ROI = net_profit / (capex_total_net + Σ interest)"
    depends_on: [F.SALES.REVENUE_TOTAL, F.CAPEX.TOTAL, F.FIN.INTEREST, F.TAX.PROFIT_TAX]
    rationale: "Недисконтированные показатели — с корректными названиями"
    rejected: []
    source_ids: [S_EXPERT]
    legacy: {cells: "Бюджет!F61:H61, Dashboard!C33:C42", verdict: fix}
    status: verified

  - id: F.KPI.COST_PER_M2
    module: KPI
    name: "Себестоимость 1 м² продаваемой площади и наценка"
    unit: руб/м2
    dims: []
    expr: "cost_m2 = (capex_total_net + Σ interest) / F.TEP.SALEABLE_AREA;  markup = wavg_price_all / cost_m2 − 1"
    depends_on: [F.CAPEX.TOTAL, F.FIN.INTEREST, F.TEP.SALEABLE_AREA, F.SALES.WAVG_PRICE]
    rationale: "Делитель — вся продаваемая площадь"
    rejected: ["Деление на площадь только квартир типа 1 (исходник Бюджет!F69 → 2,96 млн руб/м², наценка −80%)"]
    source_ids: [S_EXPERT]
    legacy: {cells: "Бюджет!F69:F71, Dashboard!C50", verdict: fix}
    status: verified

  - id: F.KPI.PEAK_EQUITY
    module: KPI
    name: "Пиковая потребность в капитале и срок окупаемости"
    unit: "руб / дата"
    dims: []
    expr: "peak_equity = −MIN_t Σ_{τ<=t} fcfe[τ];  payback_date = первая date[t] после пика, где Σ_{τ<=t} fcfe[τ] >= 0"
    depends_on: [F.CF.FCFE]
    rationale: "Ключевые для инвестора показатели ликвидности"
    rejected: []
    source_ids: [S_EXPERT]
    legacy: {cells: null, verdict: new}
    status: verified

  - id: F.KPI.LTC_LTV
    module: KPI
    name: "LTC и LTV"
    unit: доля
    dims: [t]
    expr: "LTC[t] = (debt[t] + accrued[t]) / Σ_{τ<=t} capex_cash[τ];  LTV[t] = (debt[t] + accrued[t]) / market_value_unsold[t], market_value_unsold = остаток площадей × price[t]"
    depends_on: [F.FIN.DEBT, F.FIN.INTEREST, F.CAPEX.ITEM_CASH, F.SALES.PRICE]
    rationale: "LTV — к рыночной стоимости активов (остаток площадей + эскроу), а не к дисконтированной стоимости капитала"
    rejected: ["LTV к «Market Value of Asset» из DCF по cost of equity (исходник CF1!F144) — зависит от выбранной ставки, max = 0 из-за неработающих флагов"]
    source_ids: [S_BANK_TERMSHEET]
    legacy: {cells: "CF1!F144:AS145, Dashboard!C46", verdict: replace}
    status: verified

  - id: F.KPI.LLCR
    module: KPI
    name: "LLCR (коэффициент покрытия долга за срок кредита)"
    unit: коэф
    dims: [t]
    expr: "LLCR[t] = Σ_{τ>=t}^{t_maturity} cfads[τ] / (1 + rate_avg)^((date[τ]−date[t])/365) / (debt[t] + accrued[t])"
    depends_on: [F.CF.CFADS, F.FIN.RATE, F.FIN.DEBT]
    rationale: "Общепринятое определение в проектном финансировании: приведённый CFADS за оставшийся срок кредита / остаток долга. Минимальное значение по периодам — ковенант"
    rejected:
      - "NPV(=FCFE) / проценты (исходник CF1!D150)"
      - "(Выручка − налоги) / (выборка + %) (исходник CF1!D155)"
      - "Две разные формулы в Dashboard!C51 и C52 с одинаковым смыслом"
    source_ids: [S_EXPERT]
    legacy: {cells: "CF1!D148:D155, Dashboard!C51:C64", verdict: replace}
    status: verified

  - id: F.KPI.UNFORECASTED_REVENUE
    module: KPI
    name: "Выручка после РНВ (продажи по ДКП)"
    unit: "руб / доля"
    dims: []
    expr: "dkp_revenue = Σ_t value[t] × flag_dkp[t];  dkp_share = dkp_revenue / revenue_gross"
    depends_on: [F.SALES.CONTRACT_VALUE, F.TIME.FLAG_POST_RNV]
    rationale: "Показатель риска: доля выручки, не участвующей в покрытии кредита эскроу"
    rejected: ["Сумма фиксированных столбцов Q:S (исходник Бюджет!E73)"]
    source_ids: [S_EXPERT]
    legacy: {cells: "Бюджет!C73:E75", verdict: replace}
    status: verified

  # =====================================================================
  # CHECK — контрольные проверки (блокируют выпуск отчёта при ошибке)
  # =====================================================================

  - id: F.CHECK.ALL
    module: CHECK
    name: "Свод проверок"
    unit: bool
    dims: []
    expr: |
      PAYMENT_MIX_SUM   : |mortgage + full + installment − 1| < 1e-9
      SCHEDULE_SUM      : для каждой статьи |Σ_t w − 1| < 1e-9
      SOLD_LE_STOCK     : Σ_t sold[k,t] <= stock[k]
      UNSOLD_AT_END     : остаток > 0 в последнем месяце → предупреждение
      REVENUE_EQ_CF     : Σ план продаж = Σ поступления (эскроу + ДКП) + дебиторка на конец
      BUDGET_EQ_CF      : Σ бюджет по статьям = Σ затрат в CF
      ESCROW_NONNEG     : esc_bal >= 0
      DEBT_LE_LIMIT     : Σ draw <= limit
      DEBT_REPAID       : debt[T] + accrued[T] = 0
      CASH_NONNEG       : cash[t] >= 0 (иначе cash gap)
      SOURCES_PRESENT   : у каждого параметра и формулы есть source_ids, у level 5 — автор и диапазон
      PARKING_NORM      : parking >= parking_required или есть документ
      NCS_DEVIATION     : |deviation| <= tolerance или есть обоснование
      APT_AREA_MATCH    : |apt_check| <= 1%
    depends_on: []
    rationale: "Ни одна из этих ошибок исходника не должна повториться незаметно"
    rejected: []
    source_ids: [S_EXPERT]
    legacy: {cells: null, verdict: new}
    status: verified
