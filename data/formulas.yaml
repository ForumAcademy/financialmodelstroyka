# Каталог формул расчётного ядра.
# Каждая формула — «паспорт»: что считаем, как, почему именно так, что отклонено, на чём основано, откуда пришло из исходника.
#
# Нотация выражений (язык-нейтральный псевдокод, реализуется 1:1 в packages/engine):
#   t            — индекс месяца (0..T-1), date[t] — последний день месяца
#   p            — очередь (phase), k — продукт/тип квартир, i — статья бюджета
#   X[t-1]       — значение в предыдущем месяце (для t=0 → 0)
#   Σ_t, Σ_k     — суммы по индексу
#   ID параметров — из parameters.yaml, ID формул — F.*
#   1{условие}   — индикатор (1 если истина, иначе 0)
#
# Поля: id, module, name, unit, dims, expr, depends_on, rationale (почему так), rejected (какие варианты отклонены и почему),
#       source_ids, legacy (ячейки исходника и вердикт), status (verified | needs_verification), example (контрольный пример).
#   lag_depends_on — подмножество depends_on, для которого берётся значение прошлого месяца X[t-1]. Такие связи
#                    разрывают цикл в графе (ставка ПФ ← покрытие эскроу за t−1); любой другой цикл — ошибка валидатора.

formulas:

  # =====================================================================
  # TIME — временная шкала и флаги
  # =====================================================================

  - id: F.TIME.DATE
    module: TIME
    name: "Дата конца месяца t"
    unit: дата
    dims: [t]
    expr: "date[t] = EOMONTH(GEN.MODEL_START_DATE, t)"
    depends_on: [GEN.MODEL_START_DATE]
    rationale: "Единая месячная шкала для всех модулей; отчёты агрегируют месяцы в кварталы/годы"
    rejected:
      - "Квартальный шаг исходника: проценты и покрытие эскроу считаются грубо, раскрытие эскроу сдвигается до 3 месяцев"
    source_ids: [S_EXPERT]
    legacy: {cells: "CF1!E2:AS2", verdict: fix, issue: "F2 = EDATE, далее EOMONTH — разные функции в одном ряду"}
    status: verified

  - id: F.TIME.DAYS
    module: TIME
    name: "Дней в месяце t"
    unit: дни
    dims: [t]
    expr: "days[t] = date[t] - date[t-1]  (для t=0: DAY(date[0]))"
    depends_on: [F.TIME.DATE]
    rationale: "Проценты по кредиту начисляются по фактическим дням (факт/365), как в кредитных договорах"
    rejected: []
    source_ids: [S_BANK_TERMSHEET]
    legacy: {cells: "CF1!F3:AS3", verdict: keep}
    status: verified

  - id: F.TIME.FLAG_CONSTRUCTION
    module: TIME
    name: "Флаг периода строительства очереди"
    unit: "0/1"
    dims: [p, t]
    expr: "flag_constr[p,t] = 1{ construction_start[p] <= date[t] < construction_end[p] }"
    depends_on: [TIME.MILESTONES, F.TIME.DATE]
    rationale: "Сравнение настоящих дат; определяет выборку ПФ и распределение СМР"
    rejected:
      - "Текстовые вехи исходника («4 кв 2025») — сравнение даты с текстом всегда ложно, флаги строки CF1!4–5 были нулевыми"
    source_ids: [S_GRK_51]
    legacy: {cells: "CF1!F4:AS5", verdict: fix, issue: "D4, D5 ссылаются на текст ТЭПы!C7, C9"}
    status: verified

  - id: F.TIME.FLAG_PRESALE
    module: TIME
    name: "Флаг продаж по ДДУ (эскроу)"
    unit: "0/1"
    dims: [p, t]
    expr: "flag_ddu[p,t] = 1{ sales_start[p] <= date[t] < rnv_date[p] }"
    depends_on: [TIME.MILESTONES, F.TIME.DATE]
    rationale: "До РНВ продажи возможны только по ДДУ с эскроу (ст.15.4 214-ФЗ); старт — не раньше РНС (ст.51 ГрК) и публикации проектной декларации"
    rejected:
      - "Исходник: граница продаж по эскроу = «окончание ПФ» (CF1!D6), а не РНВ очереди; флаги AB8:AS8 перебиты нулями вручную"
    source_ids: [S_214_ART15_4, S_GRK_51, S_GRK_55]
    legacy: {cells: "CF1!F8:AS9", verdict: fix}
    status: verified

  - id: F.TIME.FLAG_POST_RNV
    module: TIME
    name: "Флаг продаж по ДКП (после РНВ)"
    unit: "0/1"
    dims: [p, t]
    expr: "flag_dkp[p,t] = 1{ date[t] >= rnv_date[p] }"
    depends_on: [TIME.MILESTONES, F.TIME.DATE]
    rationale: "После РНВ нераспроданные помещения продаются по ДКП, деньги поступают застройщику напрямую"
    rejected: []
    source_ids: [S_GRK_55]
    legacy: {cells: "CF1!F9:AS9", verdict: fix}
    status: verified

  - id: F.TIME.FLAG_ESCROW_RELEASE
    module: TIME
    name: "Флаг месяца раскрытия эскроу очереди"
    unit: "0/1"
    dims: [p, t]
    expr: "flag_release[p,t] = 1{ t == month_index(rnv_date[p]) + TIME.ESCROW_RELEASE_LAG_M }"
    depends_on: [TIME.MILESTONES, TIME.ESCROW_RELEASE_LAG_M]
    rationale: "ч.6 ст.15.5 214-ФЗ — перечисление не позднее 10 рабочих дней после РНВ; раскрытие по каждой очереди отдельно"
    rejected:
      - "Раскрытие одной датой для всех очередей по «окончанию ПФ» (исходник) — завышает процентные расходы по ранним очередям"
    source_ids: [S_214_ART15_5]
    legacy: {cells: "CF1!F6:AS6", verdict: fix, issue: "AB6 = 1 проставлено руками"}
    status: verified

  # =====================================================================
  # TEP — площади
  # =====================================================================

  # Источник площадей зависит от GEN.PROJECT_STAGE (см. шапку раздела TEP в parameters.yaml):
  #   «оценка участка» — предельные параметры ГПЗУ/ПЗЗ + коэффициенты уровня 4/5;
  #   «концепция»      — ТЭП архитектора (уровень 4, вложение обязательно).

  - id: F.TEP.GFA_ABOVE
    module: TEP
    name: "ГНС наземной части в модели"
    unit: м2
    dims: []
    expr: |
      стадия «концепция»:      gfa_above = TEP.GFA_ABOVE
      стадия «оценка участка»: gfa_above = GPZU.MAX_GFA_ABOVE, если суммарная поэтажная площадь указана в ГПЗУ/ПЗЗ;
                               иначе gfa_above = TEP.FOOTPRINT_AREA × TEP.AVG_FLOORS
      соответствие пределам ГПЗУ проверяет F.CHECK.GPZU_LIMITS (на стадии оценки — автоматически)
    depends_on: [GEN.PROJECT_STAGE, TEP.GFA_ABOVE, GPZU.MAX_GFA_ABOVE, TEP.FOOTPRINT_AREA, TEP.AVG_FLOORS]
    rationale: "До концепции объём застройки ограничен предельными параметрами разрешённого строительства (ст.38 ГрК РФ): суммарная поэтажная площадь из ГПЗУ/ПЗЗ — прямой предел; если её нет — пятно застройки × средняя этажность, где пятно не больше участка × максимальный процент застройки. После концепции — ТЭП архитектора, который сверяется с пределами ГПЗУ"
    rejected:
      - "Ввод ГНС числом на стадии оценки без документа — не проверяется по ГПЗУ"
      - "Молча ограничивать пятно MIN(пятно, участок × % застройки) — скрывает ошибку ввода; вместо этого блокирующая ошибка F.CHECK.GPZU_LIMITS"
      - "Одна «СПП (ГНС)» без указания стадии и документа (исходник ТЭПы!C19)"
    source_ids: [S_GRK_38, S_PROJECT_DOCS]
    legacy: {cells: "ТЭПы!C19", verdict: fix, issue: "вводилось числом без указания, из ГПЗУ или из концепции"}
    status: verified

  - id: F.TEP.GFA_SPLIT
    module: TEP
    name: "ГНС жилой, апартаментной и нежилой части в модели"
    unit: м2
    dims: []
    expr: |
      стадия «концепция»: res_gfa = TEP.RES_GFA;  apart_gfa = TEP.APART_GFA;  nonres_gfa = TEP.NONRES_GFA
      стадия «оценка участка»:
        если ГПЗУ/ППТ задают разделение (TEP.RES_GFA, TEP.NONRES_GFA, при апартаментах — TEP.APART_GFA) — они же;
        иначе res_gfa    = F.TEP.GFA_ABOVE × TEP.RES_GFA_SHARE
              apart_gfa  = F.TEP.GFA_ABOVE × TEP.APART_GFA_SHARE
              nonres_gfa = F.TEP.GFA_ABOVE × (1 − TEP.RES_GFA_SHARE − TEP.APART_GFA_SHARE)
        ошибка, если TEP.RES_GFA_SHARE + TEP.APART_GFA_SHARE > 1
      apart_gfa > 0 допускается, только если ВРИ участка включает код 4.7 (F.CHECK.ALL → APART_ALLOWED)
    depends_on: [GEN.PROJECT_STAGE, TEP.RES_GFA, TEP.APART_GFA, TEP.NONRES_GFA, F.TEP.GFA_ABOVE, TEP.RES_GFA_SHARE, TEP.APART_GFA_SHARE]
    rationale: "Жилая, апартаментная и нежилая части имеют разные коэффициенты продаваемой площади, разные продукты, цены и НДС. Разделение берётся из документа, а при его отсутствии — долями, чтобы части в сумме давали ГНС наземную"
    rejected:
      - "Одну часть из документа, а другую — долей: смешение документа и допущения, сумма может не совпасть с ГНС"
      - "Считать апартаменты частью жилой ГНС: апартаменты — нежилые помещения с другим ВРИ, НДС и ипотекой"
    source_ids: [S_GRK_38, S_PROJECT_DOCS, S_COMPANY_ACTUALS, S_ROSREESTR_P0412]
    legacy: {cells: "ТЭПы!C20:C21", verdict: keep}
    status: verified

  - id: F.TEP.APT_AREA
    module: TEP
    name: "Площадь квартир в модели (для продажи, по ДДУ)"
    unit: м2
    dims: []
    expr: |
      стадия «концепция»:      apt_area_total = TEP.APT_AREA
      стадия «оценка участка»: apt_area_total = res_gfa × TEP.APT_EFFICIENCY   (res_gfa — из F.TEP.GFA_SPLIT)
    depends_on: [GEN.PROJECT_STAGE, TEP.APT_AREA, F.TEP.GFA_SPLIT, TEP.APT_EFFICIENCY]
    rationale: "Площадь квартиры для продажи — площадь по ДДУ: общая площадь жилого помещения (ч.5 ст.15 ЖК РФ) плюс лоджии × 0,5, балконы × 0,3, террасы × 0,3, веранды × 1,0 (Приказ Минстроя № 854/пр); обмер — Приказ Росреестра № П/0393, приложение 2. До концепции площадь квартир получают из ГНС жилой части через коэффициент, подтверждённый фактом компании (уровень 4) или экспертом (уровень 5)"
    rejected:
      - "Ввод итоговой площади квартир на стадии оценки без коэффициента — непроверяемо"
      - "Обратный расчёт коэффициента из заданной площади (исходник ТЭПы!D22 = C22/C20)"
      - "Общая площадь по ЖК без лоджий/балконов — не совпадает с площадью в ДДУ, по которой считается выручка"
    source_ids: [S_ZHK_15, S_MINSTROY_854, S_ROSREESTR_P0393, S_PROJECT_DOCS, S_COMPANY_ACTUALS]
    legacy: {cells: "ТЭПы!C22, ТЭПы!D22", verdict: fix, issue: "площадь вбита числом, коэффициент получен обратным делением"}
    status: verified

  - id: F.TEP.COMM_AREA
    module: TEP
    name: "Площадь ПСН в модели"
    unit: м2
    dims: []
    expr: |
      стадия «концепция»:      comm_area = TEP.COMM_AREA
      стадия «оценка участка»: comm_area = nonres_gfa × TEP.COMM_EFFICIENCY   (nonres_gfa — из F.TEP.GFA_SPLIT)
    depends_on: [GEN.PROJECT_STAGE, TEP.COMM_AREA, F.TEP.GFA_SPLIT, TEP.COMM_EFFICIENCY]
    rationale: "Та же логика, что для квартир, со своим коэффициентом: у нежилой части иная доля продаваемой площади. Обмер — Приказ Росреестра № П/0393, приложение 2"
    rejected:
      - "Применять к нежилой части коэффициент квартир — разная планировочная эффективность"
      - "Коэффициент 0,8 без назначения (исходник ТЭПы!D23)"
    source_ids: [S_ROSREESTR_P0393, S_PROJECT_DOCS, S_COMPANY_ACTUALS]
    legacy: {cells: "ТЭПы!C23", verdict: keep}
    status: verified

  - id: F.TEP.APART_AREA
    module: TEP
    name: "Площадь апартаментов в модели"
    unit: м2
    dims: []
    expr: |
      стадия «концепция»:      apart_area = TEP.APART_AREA
      стадия «оценка участка»: apart_area = apart_gfa × TEP.APART_EFFICIENCY   (apart_gfa — из F.TEP.GFA_SPLIT)
      apart_area = 0, если «4.7» ∉ LAND.VRI_CODES
    depends_on: [GEN.PROJECT_STAGE, TEP.APART_AREA, F.TEP.GFA_SPLIT, TEP.APART_EFFICIENCY, LAND.VRI_CODES]
    rationale: "Апартаменты — нежилые помещения гостиничного назначения: допустимы только при ВРИ 4.7 «Гостиничное обслуживание» (классификатор ВРИ, Приказ Росреестра № П/0412). Площадь — по той же логике, что квартиры, со своим коэффициентом; обмер — П/0393"
    rejected:
      - "Разрешать апартаменты без проверки ВРИ — продукт может оказаться недопустимым на участке"
      - "Применять к апартаментам коэффициент квартир — другая планировочная эффективность"
    source_ids: [S_ROSREESTR_P0412, S_ROSREESTR_P0393, S_PROJECT_DOCS, S_COMPANY_ACTUALS]
    legacy: {cells: null, verdict: new}
    status: needs_verification

  - id: F.TEP.STORAGE
    module: TEP
    name: "Кладовые: количество и площадь в модели"
    unit: шт
    dims: []
    expr: |
      стадия «концепция»:      storage_count = TEP.STORAGE_COUNT;  storage_area = TEP.STORAGE_AREA
      стадия «оценка участка»: storage_count = FLOOR( Σ_k F.TEP.APT_COUNT[k] × TEP.STORAGE_PER_APT );
                               storage_area  = storage_count × TEP.STORAGE_AVG_AREA
      площадь кладовых входит в подземную часть (F.TEP.GFA_BELOW), сверх неё не добавляется
    depends_on: [GEN.PROJECT_STAGE, TEP.STORAGE_COUNT, TEP.STORAGE_AREA, F.TEP.APT_COUNT, TEP.STORAGE_PER_APT, TEP.STORAGE_AVG_AREA]
    rationale: "Кладовые продаются поштучно и размещаются в подземной части. До концепции количество определяется обеспеченностью на квартиру по концепциям компании (уровень 4), округление вниз — нельзя продать больше, чем построено"
    rejected:
      - "Добавлять площадь кладовых к ГНС сверх подземной части — двойной счёт"
      - "Фиксированное количество без привязки к числу квартир"
    source_ids: [S_COMPANY_ACTUALS, S_PROJECT_DOCS, S_ROSREESTR_P0393]
    legacy: {cells: "ТЭПы!E50", verdict: fix, issue: "«Прочие помещения» = 0"}
    status: verified

  - id: F.TEP.APT_COUNT
    module: TEP
    name: "Количество квартир по типу"
    unit: шт
    dims: [k]
    expr: |
      стадия «концепция»:      count[k] = TEP.APT_MIX.count[k]
      стадия «оценка участка»: count[k] = FLOOR( TEP.APT_MIX.area_share[k] × apt_area_total / TEP.APT_MIX.avg_area[k] )
                               ошибка, если |Σ_k area_share[k] − 1| > 1e-9
    depends_on: [GEN.PROJECT_STAGE, TEP.APT_MIX, F.TEP.APT_AREA]
    rationale: "Квартира — целое число. На стадии оценки квартирография задаётся долями площади и средней площадью типа, количество вычисляется; округление вниз гарантирует, что продаётся не больше площади, чем есть"
    rejected:
      - "ROUND — может дать площадь больше F.TEP.APT_AREA"
      - "Дробное количество (исходник: дробные лоты ПСН 136,1 × 80 м², План продаж!43)"
      - "Одновременный ввод количества и долей (исходник ТЭПы!C41:C43 и F41:F43) — расходятся"
    source_ids: [S_PROJECT_DOCS, S_COMPANY_ACTUALS]
    legacy: {cells: "ТЭПы!F41:F43", verdict: keep}
    status: verified
    example: {input: {area_share: 0.25, apt_area_total: 143560, avg_area: 35.108}, output: 1022}

  - id: F.TEP.APT_TYPE_AREA
    module: TEP
    name: "Площадь квартир по типу"
    unit: м2
    dims: [k]
    expr: "apt_area[k] = F.TEP.APT_COUNT[k] × TEP.APT_MIX.avg_area[k]"
    depends_on: [F.TEP.APT_COUNT, TEP.APT_MIX]
    rationale: "Количество и средняя площадь — первичные данные квартирографии; средняя площадь — по ДДУ, как F.TEP.APT_AREA"
    rejected: []
    source_ids: [S_PROJECT_DOCS]
    legacy: {cells: "ТЭПы!E41:E43", verdict: keep}
    status: verified
    example: {input: {count: 961, avg_area: 35.108}, output: 33738.788}

  - id: F.TEP.APT_SHARE
    module: TEP
    name: "Доля типа квартир (по количеству)"
    unit: доля
    dims: [k]
    expr: "apt_share[k] = F.TEP.APT_COUNT[k] / Σ_k F.TEP.APT_COUNT[k]"
    depends_on: [F.TEP.APT_COUNT]
    rationale: "Доля вычисляется — нельзя получить противоречие между долей и количеством"
    rejected: ["Ручной ввод долей параллельно с количеством (ТЭПы!C41:C43)"]
    source_ids: [S_PROJECT_DOCS]
    legacy: {cells: "ТЭПы!C41:C43", verdict: replace}
    status: verified

  - id: F.TEP.APT_AREA_CHECK
    module: TEP
    name: "Сверка площади квартир: квартирография vs ТЭП"
    unit: доля
    dims: []
    expr: "apt_diff_m2 = Σ_k apt_area[k] − apt_area_total;  apt_check = apt_diff_m2 / apt_area_total;  предупреждение «расхождение {apt_diff_m2} м² ({apt_check})», если |apt_check| > TEP.APT_AREA_TOLERANCE"
    depends_on: [F.TEP.APT_TYPE_AREA, F.TEP.APT_AREA, TEP.APT_AREA_TOLERANCE]
    rationale: "На стадии концепции площадь квартир есть дважды — итог ТЭП и сумма квартирографии; на стадии оценки сумма меньше итога из-за округления количества вниз. Расхождение больше порога должно быть видно с разницей в м² и %"
    rejected: ["Молча брать одно из двух чисел (в исходнике ТЭПы!E44 и ТЭПы!C22 введены независимо)"]
    source_ids: [S_PROJECT_DOCS]
    legacy: {cells: "ТЭПы!E44 vs ТЭПы!C22", verdict: new}
    status: verified

  - id: F.TEP.PARKING_REQUIRED
    module: TEP
    name: "Требуемое количество машино-мест по нормативу региона"
    unit: шт
    dims: []
    expr: "parking_required = CEILING( Σ_k F.TEP.APT_COUNT[k] × norm(TEP.APT_MIX.avg_area[k]) + parking_apart ), norm() — из TEP.PARKING_NORM региона (Москва — ПП № 2118-ПП от 05.08.2026, СПб — ПП № 257 от 11.04.2017); parking_apart — по TEP.PARKING_NORM_APART (НГП для объектов гостиничного назначения, единица — по акту региона) от F.TEP.APART_AREA"
    depends_on: [F.TEP.APT_COUNT, TEP.APT_MIX, TEP.PARKING_NORM, TEP.PARKING_NORM_APART, F.TEP.APART_AREA]
    rationale: "Нормативы обеспеченности — обязательное требование РНГП; число мест определяет подземную часть и выручку"
    rejected: ["Вбитое число без документа (862 в исходнике при нормативе ≈ 2 785)"]
    source_ids: [S_MSK_PARKING_2118PP, S_SPB_NGP_257, S_SP_42_2026]
    legacy: {cells: "ТЭПы!J41:J44", verdict: fix, issue: "J44 перебит числом 862"}
    status: needs_verification
    example: {input: {counts: [961, 720, 720], norms: [0.8, 1.2, 1.6]}, output: 2785}

  - id: F.TEP.PARKING_COUNT
    module: TEP
    name: "Количество машино-мест в модели"
    unit: шт
    dims: []
    expr: |
      parking_calc = MAX( F.TEP.PARKING_REQUIRED, TEP.PARKING_GPZU_COUNT ?? 0 )
      parking = TEP.PARKING_COUNT_OVERRIDE ?? parking_calc      (override — только с вложенным документом)
      предупреждение «ниже норматива, основание — документ», если override < F.TEP.PARKING_REQUIRED
    depends_on: [F.TEP.PARKING_REQUIRED, TEP.PARKING_GPZU_COUNT, TEP.PARKING_COUNT_OVERRIDE]
    rationale: "Число мест — норматив региона или больше, если так требуют ГПЗУ/ППТ. Отклонение, в том числе меньше норматива, допустимо только по документу (ГПЗУ, ППТ, СТУ, решение органа)"
    rejected:
      - "Вбитое число поверх норматива без документа (исходник ТЭПы!C27, J44 = 862)"
      - "Брать ГПЗУ/ППТ, даже если оно меньше норматива, — норматив обязателен; меньшее число — только по документу через override"
    source_ids: [S_PROJECT_DOCS, S_MSK_PARKING_2118PP, S_SPB_NGP_257]
    legacy: {cells: "ТЭПы!C27", verdict: fix}
    status: verified

  - id: F.TEP.PARKING_SPACE_MIN_AREA
    module: TEP
    name: "Минимальная площадь машино-места"
    unit: м2
    dims: []
    expr: "parking_space_min = TEP.PARKING_SPACE_MIN_LENGTH × TEP.PARKING_SPACE_MIN_WIDTH"
    depends_on: [TEP.PARKING_SPACE_MIN_LENGTH, TEP.PARKING_SPACE_MIN_WIDTH]
    rationale: "Нижняя граница площади на одно машино-место: само место не меньше 5,3 × 2,5 м (Приказ Росреестра № П/0316); с проездами площадь не может быть меньше. Максимальный размер с 28.10.2021 не ограничен — верхней границы нет"
    rejected: ["Задавать 13,25 м² отдельным числом — теряется связь с размерами из приказа"]
    source_ids: [S_ROSREESTR_P0316]
    legacy: {cells: null, verdict: new}
    status: verified
    example: {input: {length: 5.3, width: 2.5}, output: 13.25}

  - id: F.TEP.GFA_BELOW_EST
    module: TEP
    name: "Оценка подземной площади по числу машино-мест и кладовым"
    unit: м2
    dims: []
    expr: "gfa_below_est = F.TEP.PARKING_COUNT × TEP.PARKING_AREA_PER_SPACE + storage_area (F.TEP.STORAGE);  ошибка, если TEP.PARKING_AREA_PER_SPACE < F.TEP.PARKING_SPACE_MIN_AREA"
    depends_on: [F.TEP.PARKING_COUNT, TEP.PARKING_AREA_PER_SPACE, F.TEP.PARKING_SPACE_MIN_AREA, F.TEP.STORAGE]
    rationale: "Только стадия «Оценка участка»: подземной концепции ещё нет. Площадь на место с проездами — факт компании (уровень 4) или эксперт (уровень 5) с обоснованием и диапазоном; меньше минимальной площади самого места быть не может. Кладовые размещаются в подземной части и входят в её площадь"
    rejected: []
    source_ids: [S_COMPANY_ACTUALS, S_ROSREESTR_P0316]
    legacy: {cells: "ТЭПы!E49, ТЭПы!C34", verdict: keep}
    status: verified
    example: {input: {parking: 862, area_per_space: 40.945}, output: 35294.59}

  - id: F.TEP.GFA_BELOW
    module: TEP
    name: "Площадь подземной части в модели"
    unit: м2
    dims: []
    expr: |
      стадия «концепция»:      gfa_below = TEP.GFA_BELOW
      стадия «оценка участка»: gfa_below = F.TEP.GFA_BELOW_EST
    depends_on: [GEN.PROJECT_STAGE, TEP.GFA_BELOW, F.TEP.GFA_BELOW_EST]
    rationale: "На стадии концепции подземная часть (паркинг, техпомещения) — из ТЭП архитектора; до неё — оценка через число машино-мест"
    rejected: ["Выводить подземную площадь из числа мест и после концепции (исходник ТЭПы!C34 = E49)"]
    source_ids: [S_PROJECT_DOCS, S_COMPANY_ACTUALS]
    legacy: {cells: "ТЭПы!C34", verdict: fix}
    status: verified

  - id: F.TEP.GFA_TOTAL
    module: TEP
    name: "ГНС общая"
    unit: м2
    dims: []
    expr: "gfa_total = F.TEP.GFA_ABOVE + F.TEP.GFA_BELOW"
    depends_on: [F.TEP.GFA_ABOVE, F.TEP.GFA_BELOW]
    rationale: "Разделение на наземную и подземную части — у них разная стоимость СМР и разный охват НЦС"
    rejected: ["Одна «СПП (ГНС)» без разделения (исходник ТЭПы!C19)"]
    source_ids: [S_PROJECT_DOCS, S_NCS_TECHPART]
    legacy: {cells: "ТЭПы!C19", verdict: fix}
    status: verified

  - id: F.TEP.SALEABLE_AREA
    module: TEP
    name: "Продаваемая площадь (м²)"
    unit: м2
    dims: []
    expr: "saleable = Σ_k apt_area[k] + apart_area (F.TEP.APART_AREA) + comm_area + storage_area (F.TEP.STORAGE);  машино-места — отдельно, в штуках (F.TEP.PARKING_COUNT), в м² не суммируются;  МОП, техпомещения и проезды паркинга не входят"
    depends_on: [F.TEP.APT_TYPE_AREA, F.TEP.APART_AREA, F.TEP.COMM_AREA, F.TEP.STORAGE]
    rationale: "Единое определение для всех проектов: продаваемая площадь = квартиры + апартаменты + ПСН + кладовые, каждая — по правилам обмера Росреестра (П/0393, приложение 2), квартиры — по ДДУ. Итоговым числом не вводится (параметра нет): сумма всегда раскладывается по продуктам и сходится с планом продаж"
    rejected:
      - "Ввод итогового числа (исходник ТЭПы!C35 = 149 281): не раскладывается по продуктам и расходится с суммой квартир и ПСН (153 882)"
      - "Суммировать м² машино-мест с м² квартир (дашборд исходника — 189 177 м²)"
      - "Включать МОП, техпомещения, проезды паркинга — они не продаются"
    source_ids: [S_ROSREESTR_P0393, S_ZHK_15, S_MINSTROY_854, S_PROJECT_DOCS]
    legacy: {cells: "ТЭПы!C35, ТЭПы!E38, CF1!D11", verdict: fix, issue: "C35 — число без расшифровки; в новой модели не используется, в режиме совместимости — только база перевода сумм бюджета в ставки на м²"}
    status: verified

  - id: F.TEP.LANDSCAPE_AREA
    module: TEP
    name: "Площадь благоустройства и её состав"
    unit: м2
    dims: []
    expr: "landscape = LAND.AREA × TEP.LANDSCAPE_SHARE; roads = landscape × TEP.ROAD_SHARE; green = landscape × TEP.GREEN_SHARE; ground_parking = landscape - roads - green"
    depends_on: [LAND.AREA, TEP.LANDSCAPE_SHARE, TEP.ROAD_SHARE, TEP.GREEN_SHARE]
    rationale: "База для статьи «Благоустройство»; проверка минимального озеленения по НГП"
    rejected: []
    source_ids: [S_PROJECT_DOCS, S_SP_42_2026]
    legacy: {cells: "ТЭПы!C29:C33", verdict: keep}
    status: verified

  # =====================================================================
  # LAND — земельные платежи
  # =====================================================================

  - id: F.LAND.TAX_COEF
    module: LAND
    name: "Повышающий коэффициент земельного налога"
    unit: коэф
    dims: [t]
    expr: "coef[t] = IF(NOT TAX.LAND_COEF_APPLY) 1 ELSE IF(years_since(land_acquired, date[t]) <= TIME.RNS_TO_RNV_TAX_YEARS) TAX.LAND_COEF_UP_TO_3Y ELSE TAX.LAND_COEF_OVER_3Y; действует до госрегистрации прав на объект (≈ handover_end последней очереди)"
    depends_on: [TAX.LAND_COEF_APPLY, TAX.LAND_COEF_UP_TO_3Y, TAX.LAND_COEF_OVER_3Y, TIME.MILESTONES]
    rationale: "п.15 ст.396 НК РФ; для участков > 300 млн руб. — позиция ФНС (письмо 25.08.2026)"
    rejected: ["Отсутствие коэффициентов (исходник) — налог занижен в 2–4 раза"]
    source_ids: [S_NK_396, S_FNS_LANDCOEF_2026]
    legacy: {cells: null, verdict: new}
    status: needs_verification

  - id: F.LAND.TAX_OR_RENT
    module: LAND
    name: "Земельный налог или аренда, помесячно"
    unit: руб
    dims: [t]
    expr: "IF LAND.TENURE = собственность: land_pay[t] = cad_value[year(t)] × TAX.LAND_RATE × F.LAND.TAX_COEF[t] / 12 × 1{land_acquired <= date[t] <= handover_end_last}
           IF LAND.TENURE = аренда: land_pay[t] = LAND.RENT_ANNUAL × index[year(t)] / 12 × 1{lease period}
           cad_value = LAND.CADASTRAL_VALUE_AFTER_VRI после смены ВРИ, иначе LAND.CADASTRAL_VALUE"
    depends_on: [LAND.TENURE, LAND.CADASTRAL_VALUE, LAND.CADASTRAL_VALUE_AFTER_VRI, TAX.LAND_RATE, F.LAND.TAX_COEF, LAND.RENT_ANNUAL]
    rationale: "Налог — от кадастровой стоимости (ст.390–391 НК РФ) по ставке муниципалитета; платёж только за период владения. Одна строка вместо двух в исходнике — нет двойного счёта"
    rejected:
      - "Равномерное деление итоговой суммы на 7,25 года (CF1!F24, F84) — игнорирует даты владения и коэффициенты"
      - "Одновременно «Аренда/налог ЗУ» и «Налог на имущество» 0,2% (исходник)"
    source_ids: [S_NK_394, S_NK_396, S_FNS_RATES, S_MSK_RENT_273PP, S_SPB_RENT_608]
    legacy: {cells: "CF1!F24:AH24, CF1!F84:AH84, CF1!B84", verdict: replace}
    status: needs_verification
    example: {input: {cad_value: 5834907660, rate: 0.015, coef: 2}, output_per_month: 14587269.15, note: "ставка 1,5% — пример для участка > 300 млн; фактическая — по ОКТМО"}

  - id: F.LAND.VRI_FEE
    module: LAND
    name: "Плата за изменение ВРИ"
    unit: руб
    dims: []
    expr: "vri_fee = region.vri_fee.exists ? region_formula(LAND.CADASTRAL_VALUE, LAND.CADASTRAL_VALUE_AFTER_VRI, ...) : 0;  Москва: от прироста кадастровой стоимости (КС2 − КС1) × коэффициент территории по приложению к ПП 593-ПП"
    depends_on: [GEN.REGION_CODE, LAND.CADASTRAL_VALUE, LAND.CADASTRAL_VALUE_AFTER_VRI]
    rationale: "Плата — региональная; привязка к приросту кадастровой стоимости делает её воспроизводимой"
    rejected: ["5 000 руб/м² ГНС (исходник Бюджет!D22) — экспертно, без источника"]
    source_ids: [S_MSK_VRI_593PP]
    legacy: {cells: "Бюджет!D22:F22", verdict: replace}
    status: needs_verification

  # =====================================================================
  # CAPEX — бюджет и график затрат
  # =====================================================================

  - id: F.CAPEX.ITEM_TOTAL
    module: CAPEX
    name: "Сумма статьи в ценах даты расценки"
    unit: руб
    dims: [i]
    expr: "item_total[i] = rate[i] × base_qty[i];  base_qty — значение параметра/формулы, указанной в capex_items.base (для «фикс» = 1)"
    depends_on: [CAPEX.ITEMS]
    rationale: "Сумма всегда выводится из ставки и объёма — любую цифру можно объяснить"
    rejected:
      - "Вбитая сумма + обратный расчёт расценки D = F/E (исходник Бюджет!D17:D49) — расценка не проверяема"
    source_ids: [S_COMPANY_ACTUALS, S_NCS_2026_01]
    legacy: {cells: "Бюджет!D17:F49", verdict: replace}
    status: verified

  - id: F.CAPEX.INDEX
    module: CAPEX
    name: "Индекс пересчёта из цен даты расценки в цены месяца t"
    unit: коэф
    dims: [i, t]
    expr: "index[i,t] = Π по годам y от price_date[i] до date[t] (1 + CAPEX.COST_INDEX[y]) ^ (доля года y в интервале)"
    depends_on: [CAPEX.COST_INDEX, CAPEX.ITEMS]
    rationale: "Стройка длится 3–6 лет; без индексации затраты занижены. Индексы — прогноз МЭР / Минстроя"
    rejected: ["Отсутствие индексации (исходник)"]
    source_ids: [S_MINEC_SCENARIO_2027, S_FGISCS]
    legacy: {cells: null, verdict: new}
    status: verified

  - id: F.CAPEX.SCHEDULE_WEIGHT
    module: CAPEX
    name: "Вес месяца в графике статьи"
    unit: доля
    dims: [i, t]
    expr: "uniform: w = 1/N в месяцах [from, to);  s_curve: x_t = (t - t_from + 1)/N, C(x) = 3x² − 2x³, w = C(x_t) − C(x_{t-1});  at_milestone: w = 1 в месяце вехи;  follow_smr: w = smr_cash[t] / Σ smr_cash;  follow_sales: w = sales_value[t] / Σ sales_value;  manual: ряд пользователя. Проверка Σ_t w = 1"
    depends_on: [CAPEX.ITEMS, TIME.MILESTONES]
    rationale: "График привязан к вехам: сдвиг РНС автоматически сдвигает затраты. S-кривая C(x) = 3x²−2x³ — симметричная кривая освоения с пиком в середине стройки"
    rejected:
      - "Ручные проценты по кварталам (исходник CF1 строки «Проставить темп,%») — не двигаются вместе с датами, суммы рядов ≠ 100% не контролируются"
    source_ids: [S_EXPERT]
    legacy: {cells: "CF1!F22:AS76 (строки «Проставить темп»)", verdict: replace, issue: "ряды сохранены в tests/cases как manual для сверки"}
    status: verified
    example: {input: {rule: s_curve, N: 4}, output: [0.15625, 0.34375, 0.34375, 0.15625]}

  - id: F.CAPEX.ITEM_CASH
    module: CAPEX
    name: "Платёж по статье в месяце t (с НДС)"
    unit: руб
    dims: [i, t]
    expr: "item_cash[i,t] = item_total[i] × w[i,t] × index[i,t] × (vat_included[i] ? 1 : 1 + TAX.VAT_RATE × vat_applicable[i])"
    depends_on: [F.CAPEX.ITEM_TOTAL, F.CAPEX.SCHEDULE_WEIGHT, F.CAPEX.INDEX, TAX.VAT_RATE]
    rationale: "Денежный поток — с НДС (так платят подрядчикам); вычитаемая часть НДС возвращается в модуле TAX"
    rejected: ["Смешение сумм с НДС и без НДС в исходнике (не указано)"]
    source_ids: [S_NK_164]
    legacy: {cells: "CF1!F21:AS76 (нечётные строки)", verdict: fix}
    status: verified

  - id: F.CAPEX.SMR_TOTAL
    module: CAPEX
    name: "Итого СМР (без НДС, в ценах расценок)"
    unit: руб
    dims: []
    expr: "smr_total = Σ item_total[i] для group ∈ {СМР, сети, благоустройство, соцобъекты}"
    depends_on: [F.CAPEX.ITEM_TOTAL]
    rationale: "База для процентных статей (техзаказчик, стройконтроль, резерв)"
    rejected: ["База техзаказчика — выручка (исходник Бюджет!E43)"]
    source_ids: [S_MINSTROY_297]
    legacy: {cells: "Бюджет!F30", verdict: fix}
    status: verified

  - id: F.CAPEX.NCS_BENCH
    module: CAPEX
    name: "Контроль СМР надземной части по НЦС"
    unit: руб
    dims: []
    expr: "ncs_bench = NCS_per_m2(класс, этажность) × F.TEP.GFA_ABOVE × region.ncs_k_per × К_рег × К_с × Ипр;  deviation = item_total[SMR_ABOVE] / ncs_bench − 1; |deviation| > CAPEX.NCS_BENCH_TOLERANCE → требуется обоснование"
    depends_on: [F.TEP.GFA_ABOVE, GEN.REGION_CODE, CAPEX.NCS_BENCH_TOLERANCE]
    rationale: "Формула пересчёта НЦС по п.40 техчасти: С = [(НЦС×М×Кпер×Кпер/зон×Крег×Кс)+Зр]×Ипр+НДС. В НЦС уже учтены ПИР, стройконтроль, резерв — при сравнении их нужно добавить к расценке компании"
    rejected: []
    source_ids: [S_NCS_2026_01, S_NCS_TECHPART]
    legacy: {cells: null, verdict: new}
    status: needs_verification

  - id: F.CAPEX.TOTAL
    module: CAPEX
    name: "Итого бюджет"
    unit: руб
    dims: []
    expr: "capex_total = Σ_i Σ_t item_cash[i,t];  проверка: = Σ бюджет по группам (CHECK.BUDGET_EQ_CF)"
    depends_on: [F.CAPEX.ITEM_CASH]
    rationale: "Итог бюджета и итог денежного потока — одно число"
    rejected: ["Бюджет и CF1 расходятся (исходник: УДС 535,6 млн есть в бюджете, нет в CF1)"]
    source_ids: [S_EXPERT]
    legacy: {cells: "Бюджет!F59, CF1!C18", verdict: fix}
    status: verified

  # =====================================================================
  # SALES — план продаж
  # =====================================================================

  - id: F.SALES.SOLD_AREA
    module: SALES
    name: "Продано в месяце, м² (шт для м/м)"
    unit: м2
    dims: [k, p, t]
    expr: "sold[k,t] = MIN( pace[k,t], remaining[k,t-1] ) × 1{ flag_ddu[p,t] OR flag_dkp[p,t] };  remaining[k,t] = stock[k] − Σ_{τ<=t} sold[k,τ]"
    depends_on: [SALES.PACE, SALES.PRODUCTS, F.TIME.FLAG_PRESALE, F.TIME.FLAG_POST_RNV]
    rationale: "Нельзя продать больше, чем построено; продажи — только в разрешённый период"
    rejected: ["Темпы без ограничения остатком (исходник)"]
    source_ids: [S_EISZHS_SALES]
    legacy: {cells: "План продаж!E28:AU54", verdict: fix}
    status: verified

  - id: F.SALES.PRICE
    module: SALES
    name: "Цена 1 м² в месяце t"
    unit: руб/м2
    dims: [k, t]
    expr: "price[k,t] = start_price[k] × Π_{τ<=t} (1 + g_month[τ]) × stage_factor(progress[p,t]);  g_month = (1 + SALES.PRICE_MARKET_GROWTH[year])^(1/12) − 1;  stage_factor — произведение надбавок SALES.PRICE_STAGE_UPLIFT пройденных стадий; progress = накопленные СМР / СМР итого по очереди"
    depends_on: [SALES.PRODUCTS, SALES.PRICE_MARKET_GROWTH, SALES.PRICE_STAGE_UPLIFT, F.CAPEX.ITEM_CASH]
    lag_depends_on: [F.CAPEX.ITEM_CASH]
    rationale: "Цена растёт по двум причинам: рынок (инфляция цен) и снижение риска по мере готовности. Раздельно — чтобы сценарии были осмысленны"
    rejected: ["Константа 2%/квартал на весь срок (исходник) — за 29 кварталов +77%, без связи со стройкой и рынком"]
    source_ids: [S_EISZHS_SERIES, S_MINEC_SCENARIO_2027]
