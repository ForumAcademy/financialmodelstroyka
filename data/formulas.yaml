    depends_on: [F.SALES.CONTRACT_VALUE, F.TIME.FLAG_POST_RNV]
    rationale: "Показатель риска: доля выручки, не участвующей в покрытии кредита эскроу"
    rejected: ["Сумма фиксированных столбцов Q:S (исходник Бюджет!E73)"]
    source_ids: [S_EXPERT]
